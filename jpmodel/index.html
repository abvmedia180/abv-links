const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LK='jpm6-lock';
function locked(){try{const l=JSON.parse(localStorage.getItem(LK)||'{}');if(l.until&&l.until>Date.now())return Math.ceil((l.until-Date.now())/1000);}catch(e){}return 0;}
function fail(){let l={n:0};try{l=JSON.parse(localStorage.getItem(LK)||'{"n":0}')}catch(e){};l.n=(l.n||0)+1;if(l.n>=5){const cd=[30,60,120][Math.min(2,Math.floor(l.n/5)-1)]*1000;l.until=Date.now()+cd;l.n=0;}localStorage.setItem(LK,JSON.stringify(l));}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const w=locked(); const err=document.getElementById('err');
  if(w){err.textContent='Locked. Try again in '+w+'s';return;}
  const pw=document.getElementById('pw').value;
  try{
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:100000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.c));
    localStorage.removeItem(LK);
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(x){fail();err.textContent='Incorrect password';document.getElementById('pw').value='';}
});
