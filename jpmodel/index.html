const LK='jpm6-lock';

function fail(){let l={n:0};try{l=JSON.parse(localStorage.getItem(LK)||'{"n":0}')}catch(e){};l.n=(l.n||0)+1;if(l.n>=5){const cd=[30,60,120][Math.min(2,Math.floor(l.n/5)-1)]*1000;l.until=Date.now()+cd;l.n=0;}localStorage.setItem(LK,JSON.stringify(l));}
