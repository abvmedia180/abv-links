<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Law School Board</title>
<style>
:root{--bg:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
--ft:#2a78d6;--pt:#eb6834;--good:#0ca30c;--warn:#fab219;--bad:#d03b3b;--you:#4a3aa7;--seq1:#cde2fb;--seq2:#9ec5f4;--seq3:#5598e7;--seq4:#2a78d6;--seq5:#184f95}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:40px}
a{color:var(--ft)}
header{padding:16px 14px 6px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--grid);box-shadow:0 2px 6px rgba(0,0,0,.06);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.bar input[type=number]{width:70px;font:inherit;padding:5px 6px;border:1px solid var(--axis);border-radius:6px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
select{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--axis);border-radius:6px;background:var(--surface)}
main{padding:0 10px}
.card{scroll-margin-top:110px;background:var(--surface);border:1px solid var(--grid);border-radius:10px;margin:10px 0;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.card>summary::-webkit-details-marker{display:none}
.nm{font-weight:650;font-size:16px}
.nm small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.rk{font-size:11px;color:#fff;background:var(--ink);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px 10px;grid-column:1/-1;margin-top:6px}
.stat div{font-size:12px;color:var(--ink2)}
.stat b{display:block;font-size:15px;color:var(--ink);font-weight:600;white-space:nowrap}
.odds{font-weight:700}
.odds.g{color:#006300}.odds.w{color:#8a5a00}.odds.b{color:#a02020}
.body{padding:4px 12px 12px;border-top:1px solid var(--grid)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px}
table{border-collapse:collapse;width:100%;font-size:13px}
td.n{white-space:nowrap}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
ul.flags{padding-left:18px;margin:4px 0;font-size:13px}
ul.flags li{margin:4px 0}
.grid{display:grid;grid-template-columns:auto repeat(5,1fr);gap:2px;font-size:11px}
.grid div{padding:5px 3px;text-align:center;border-radius:3px;background:var(--surface)}
.grid .h{color:var(--muted)}
.grid .c{color:var(--ink);border:1px solid var(--ring)}
.grid .c.you{outline:2px solid var(--you);outline-offset:-1px}
.grid .c.l1{background:var(--seq1)}.grid .c.l2{background:var(--seq2)}.grid .c.l3{background:var(--seq3);color:#fff}.grid .c.l4{background:var(--seq4);color:#fff}.grid .c.l5{background:var(--seq5);color:#fff}
.grid .c small{display:block;font-size:11px;opacity:.75}
svg{display:block;width:100%;height:auto}
.leg{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap;margin:4px 0}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 8px;border-radius:5px;z-index:9;display:none;max-width:240px}
.links{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--axis);color:var(--ink2);margin-left:4px}
.dl{margin:10px 0}
.dl .row{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13px}
.dl .d{font-weight:600}
.dl .soon{color:#a02020}
footer{padding:20px 14px;font-size:12px;color:var(--muted)}
@media(max-width:480px){.stat{grid-template-columns:repeat(2,1fr)}.bar{padding:6px 10px;gap:6px}.bar input[type=number]{width:62px}select{max-width:150px}}
@media(min-width:760px){main{max-width:980px;margin:0 auto}header,.bar{max-width:980px;margin:0 auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}}
#gate{max-width:360px;margin:80px auto;padding:0 20px;text-align:center}
#gate input{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--axis);border-radius:8px;margin:10px 0}
#gate button{font:inherit;font-size:15px;padding:10px 18px;border-radius:8px;border:0;background:var(--ink);color:#fff}
</style>
</head>
<body>
<div id="gate" hidden>
  <h1>Law School Board</h1>
  <p class="sub">Enter the password.</p>
  <input id="pw" type="password" autocomplete="current-password" inputmode="text">
  <button id="unlock">Open</button>
  <p id="gate-err" class="sub"></p>
</div>
<div id="app" hidden>
<header>
  <h1>Law School Board</h1>
  <div class="sub" id="built"></div>
</header>
<div class="bar">
  <label>GPA <input id="gpa" type="number" step="0.01" min="1" max="4.33" placeholder="2.78"></label>
  <label>LSAT <input id="lsat" type="number" step="1" min="120" max="180" placeholder="160"></label>
  <span class="seg" id="prog"><button data-v="Full-time" class="on">Full-time</button><button data-v="Part-time">Part-time</button></span>
  <select id="sort">
    <option value="rank">Sort: Abe's list order</option>
    <option value="odds">Sort: your odds (LSD)</option>
    <option value="lsat">Sort: LSAT median</option>
    <option value="accept">Sort: 509 acceptance rate</option>
    <option value="tuition">Sort: tuition</option>
    <option value="grant">Sort: median grant</option>
    <option value="deadline">Sort: deadline</option>
  </select>
</div>
<main>
  <section id="deadlines" class="dl"></section>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
</div>
<div class="tip" id="tip"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=(v,d=0)=>v==null?"–":Number(v).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const usd=v=>v==null?"–":"$"+Math.round(v).toLocaleString();
const pct=v=>v==null?"–":fmt(v,v<10?1:0)+"%";
const GB=["<2.75","2.75-2.99","3.00-3.24","3.25-3.49","3.50-3.74","3.75+"], LB=["<150","150-154","155-159","160-164","165+"];
const gband=g=>g==null?null:g<2.75?GB[0]:g<3?GB[1]:g<3.25?GB[2]:g<3.5?GB[3]:g<3.75?GB[4]:GB[5];
const lband=l=>l==null?null:l<150?LB[0]:l<155?LB[1]:l<160?LB[2]:l<165?LB[3]:LB[4];
const state={prog:localStorage.prog||"Full-time",gpa:+localStorage.gpa||null,lsat:+localStorage.lsat||null,sort:localStorage.sort||"rank",open:new Set()};
let D;

function parseDate(s){ if(!s) return null; const m=String(s).match(/([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})/); if(m){const d=new Date(`${m[1]} ${m[2]}, ${m[3]}`); return isNaN(d)?null:d;} const iso=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return iso?new Date(+iso[1],+iso[2]-1,+iso[3]):null; }
function edDates(txt){ const out=[]; const re=/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})(?:,?\s*(\d{4}))?/g; let m; while((m=re.exec(txt))){ const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].indexOf(m[1]); const yr=m[3]?+m[3]:(mo>=8?2026:2027); const d=new Date(yr,mo,+m[2]); if(!isNaN(d)) out.push(d); } if(!out.length){ const m2=txt.match(/\b(Early|early)\s+(\w+)\s+(\d{4})/); if(m2){const mo=["january","february","march","april","may","june","july","august","september","october","november","december"].indexOf(m2[2].toLowerCase()); if(mo>=0) out.push(new Date(+m2[3],mo,1));} } return out; }
function deadlineOf(s){ const a=s.app; for(const v of [a.deadline,a.lsac_deadline]){ const d=parseDate(v); if(d) return {d,src:"application"}; } const d=parseDate(s.notion.deadline); if(d) return {d,src:"tracker"}; const p=parseDate(s.aba["2025"].deadline_prior); if(p){ return {d:new Date(p.getFullYear()+1,p.getMonth(),p.getDate()),src:"prior cycle +1yr"}; } return null; }
function lsdCur(s,prog){ const e=s.lsd[prog]; return e&&e.cycles[D.current_cycle]||null; }
function odds(s,prog){ // pooled across cycles for the user's GPA×LSAT cell
  const e=s.lsd[prog]; if(!e||state.gpa==null||state.lsat==null) return null;
  const k=gband(state.gpa)+"|"+lband(state.lsat); let a=0,n=0;
  for(const c of Object.values(e.cycles)){ const g=c.grid[k]; if(g){a+=g[0];n+=g[1];} }
  return n?{a,n,p:100*a/n}:{a:0,n:0,p:null};
}
function nearOdds(s,prog){ // tighter: within ±0.15 GPA and ±2 LSAT, pooled
  const e=s.lsd[prog]; if(!e||state.gpa==null||state.lsat==null) return null; let a=0,n=0,w=0;
  for(const c of Object.values(e.cycles)) for(const r of c.rows){ if(r[0]==null||r[1]==null||!"ARW".includes(r[2])) continue; if(Math.abs(r[0]-state.gpa)<=0.15&&Math.abs(r[1]-state.lsat)<=2){n++; if(r[2]=="A")a++; if(r[2]=="W")w++;} }
  return {a,n,w,p:n?100*a/n:null};
}
function oddsClass(p){ return p==null?"":p>=60?"g":p>=30?"w":"b"; }
function tri(arr){ return arr&&arr.some(x=>x!=null)?arr.map(x=>x==null?"–":x).join(" / "):"–"; }

function render(){
  const prog=state.prog, cur=D.current_cycle;
  $("#built").textContent=`Built ${D.built.replace("T"," ")} · ABA 509 (2025 report, class entering fall 2025) · LSD.Law self-reported applicants, cycles ${D.lsd_meta.cycles.join(", ")}, harvested ${D.lsd_meta.scraped[cur]||""} · LSAC previews from Notion`;
  document.querySelectorAll("#prog button").forEach(b=>b.classList.toggle("on",b.dataset.v==prog));
  $("#gpa").value=state.gpa??""; $("#lsat").value=state.lsat??""; $("#sort").value=state.sort;
  const rows=D.schools.map(s=>{ const a=s.aba["2025"], lc=lsdCur(s,prog), o=odds(s,prog), no=nearOdds(s,prog), dl=deadlineOf(s);
    const lsatArr=prog=="Part-time"&&a.lsat.pt.some(x=>x)?a.lsat.pt:a.lsat.all, gpaArr=prog=="Part-time"&&a.ugpa.pt.some(x=>x)?a.ugpa.pt:a.ugpa.all;
    return {s,a,lc,o,no,dl,lsatArr,gpaArr,tuition:prog=="Part-time"?(a.tuition_pt||a.tuition_ft):a.tuition_ft,grant:prog=="Part-time"?(a.grant_50?.pt||a.grant_50?.ft):a.grant_50?.ft}; });
  const key={rank:r=>r.s.notion.scrape_rank??(r.s.short=="Fordham"?1:99), odds:r=>-(r.no?.p??r.o?.p??-1), lsat:r=>-(r.lsatArr[1]??0), accept:r=>-(r.a.accept_rate??0), tuition:r=>r.tuition??9e9, grant:r=>-(r.grant??0), deadline:r=>r.dl?r.dl.d.getTime():9e15}[state.sort];
  rows.sort((x,y)=>key(x)-key(y) || x.s.short.localeCompare(y.s.short));
  // deadlines strip
  const now=new Date(), items=[];
  for(const r of rows){ if(r.dl&&r.dl.d>now) items.push({d:r.dl.d,s:r.s,label:"deadline",src:r.dl.src});
    for(const [kind,txt] of [[/non-binding|early action/i.test(r.s.app.ed||"")?"EA":"ED",r.s.app.ed],["priority",r.s.app.priority]]){ if(!txt) continue; for(const d of edDates(txt)) if(d>now) items.push({d,s:r.s,label:kind,src:"application"}); } }
  items.sort((x,y)=>x.d-y.d);
  $("#deadlines").innerHTML=`<h3>Next dates</h3>`+items.slice(0,10).map(it=>{const days=Math.round((it.d-now)/864e5);return `<div class="row"><span class="d ${days<45?"soon":""}">${it.d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}</span><span><b>${esc(it.s.short)}</b> ${it.label!="deadline"?`<span class="pill">${it.label}</span>`:""} · ${days} days${it.src!="application"?` <span class="pill">${it.src}</span>`:""}</span></div>`;}).join("");
  $("#list").innerHTML=rows.map(r=>card(r,prog)).join("");
  document.querySelectorAll("details.card").forEach(d=>{ d.open=state.open.has(d.dataset.id); d.addEventListener("toggle",()=>{ d.open?state.open.add(d.dataset.id):state.open.delete(d.dataset.id); if(d.open) drawScatter(d.dataset.id,prog); }); if(d.open) drawScatter(d.dataset.id,prog); });
  $("#foot").innerHTML=`Sources: ABA Required Disclosures Standard 509 reports (primary, official; percentiles are enrolled 1Ls). LSD.Law applicant data © LSD.Law contributors, CC BY-NC 4.0, self-reported and skewed toward admits, personal research only. Application details from LSAC Preview Applications via the Notion LS Application Scrape (Sept 8, 2026). "Your odds" = accepted ÷ decided among LSD applicants near your numbers, pooled across the cycles shown; small n means anecdote, not data. Tuition = 1L resident tuition 2025-26 per the 509 (fees excluded).`;
}
function card(r,prog){
  const {s,a,lc,o,no,dl}=r, n=s.notion, rank=n.scrape_rank??(s.short=="Fordham"?1:null);
  const oddsCell=no&&no.n>=3?`<b class="odds ${oddsClass(no.p)}">${pct(no.p)}</b>near you (n=${no.n})`:o&&o.n>=3?`<b class="odds ${oddsClass(o.p)}">${pct(o.p)}</b>your band (n=${o.n})`:`<b class="odds">–</b>${state.gpa&&state.lsat?"too few near you":"enter GPA + LSAT"}`;
  return `<details class="card" data-id="${s.id}"><summary>
    <div class="nm">${rank?`<span class="rk">#${rank}</span>`:""}${esc(s.short)}<small>${esc(s.city)}, ${s.state}${n.commute?` · ${esc(n.commute)}`:""}${n.abe_rank?` · Abe's #${n.abe_rank}`:""}</small></div>
    <div class="sub">${dl?dl.d.toLocaleDateString(undefined,{month:"short",day:"numeric"}):""}</div>
    <div class="stat">
      <div><b>${tri(r.lsatArr)}</b>LSAT 25/50/75${prog=="Part-time"&&a.lsat.pt.some(x=>x)?" (PT)":""}</div>
      <div><b>${tri(r.gpaArr)}</b>GPA 25/50/75${prog=="Part-time"&&a.ugpa.pt.some(x=>x)?" (PT)":""}</div>
      <div><b>${pct(a.accept_rate)}</b>accepted (509)</div>
      <div><b>${lc?pct(lc.accept_rate):"–"}</b>LSD ${prog=="Part-time"?"PT":"FT"} ${D.current_cycle} (n=${lc?lc.decided:0})</div>
      <div>${oddsCell}</div>
      <div><b>${usd(r.tuition)}</b>tuition ${prog=="Part-time"?"PT":"FT"}</div>
      <div><b>${usd(r.grant)}</b>median grant</div>
    </div></summary>
    <div class="body">${detail(r,prog)}</div></details>`;
}
function detail(r,prog){
  const {s,a}=r, a24=s.aba["2024"], ap=s.app, n=s.notion;
  const lsd=s.lsd[prog], other=s.lsd[prog=="Full-time"?"Part-time":"Full-time"];
  const cyc=lsd?Object.entries(lsd.cycles):[];
  const emp=(s.lsd["Full-time"]||{}).employment, bar=(s.lsd["Full-time"]||{}).bar, proc=(s.lsd["Full-time"]||{}).process;
  let h=`<div class="two"><div>
  <h3>ABA 509, class entering fall 2025</h3>
  <div class="tw"><table><tr><th></th><th class="n">All</th><th class="n">Full-time</th><th class="n">Part-time</th></tr>
  <tr><td>1L class</td><td class="n">${fmt(a.class_total)}</td><td class="n">${fmt(a.class_ft)}</td><td class="n">${fmt(a.class_pt)}</td></tr>
  <tr><td>LSAT 25/50/75</td><td class="n">${tri(a.lsat.all)}</td><td class="n">${tri(a.lsat.ft)}</td><td class="n">${tri(a.lsat.pt)}</td></tr>
  <tr><td>GPA 25/50/75</td><td class="n">${tri(a.ugpa.all)}</td><td class="n">${tri(a.ugpa.ft)}</td><td class="n">${tri(a.ugpa.pt)}</td></tr>
  <tr><td>Tuition (resident, 1L)</td><td></td><td class="n">${usd(a.tuition_ft)}</td><td class="n">${usd(a.tuition_pt)}</td></tr>
  <tr><td>Receiving grants</td><td class="n">${pct(a.grant_pct?.all)}</td><td class="n">${pct(a.grant_pct?.ft)}</td><td class="n">${pct(a.grant_pct?.pt)}</td></tr>
  <tr><td>Grant 25/50/75</td><td></td><td class="n">${usd(a.grant_25?.ft)} / ${usd(a.grant_50?.ft)} / ${usd(a.grant_75?.ft)}</td><td class="n">${usd(a.grant_25?.pt)} / ${usd(a.grant_50?.pt)} / ${usd(a.grant_75?.pt)}</td></tr>
  </table></div>
  <div class="kv" style="margin-top:8px">
    <span>Applications</span><span>${fmt(a.apps)} → ${fmt(a.offers)} offers (${pct(a.accept_rate)}), yield ${pct(a.yield)}${a24.accept_rate?` · prior year ${pct(a24.accept_rate)}, LSAT median ${a24.lsat?.all?.[1]??"–"}`:""}</span>

    <span>Full-tuition awards</span><span>${pct(a.full_tuition_pct)} of students</span>
    <span>Living (off campus)</span><span>${usd(a.living)}</span>
  </div>
  <h3>Application, fall 2027</h3>
  <div class="kv">
    ${ap.deadline?`<span>Deadline</span><span>${esc(ap.deadline)}</span>`:ap.lsac_deadline&&ap.lsac_deadline!="—"?`<span>Deadline (LSAC)</span><span>${esc(ap.lsac_deadline)}</span>`:`<span>Deadline</span><span>not posted yet${a.deadline_prior?` · prior cycle was ${esc(a.deadline_prior)}`:""}</span>`}
    ${ap.priority?`<span>Priority</span><span>${esc(ap.priority)}</span>`:""}
    ${ap.ed?`<span>Early decision</span><span>${esc(ap.ed)}</span>`:""}
    ${ap.opens||ap.lsac_opens?`<span>Opens</span><span>${esc(ap.opens||ap.lsac_opens)}</span>`:""}
    ${ap.fee?`<span>Fee</span><span>${esc(ap.fee)}</span>`:a.app_fee!=null?`<span>Fee (509)</span><span>$${a.app_fee}</span>`:""}
    ${ap.lors?`<span>LORs</span><span>${esc(ap.lors)}</span>`:""}
    ${ap.test?`<span>Test</span><span>${esc(ap.test)}</span>`:""}
    ${ap.last_lsat?`<span>Last LSAT</span><span>${esc(ap.last_lsat)}</span>`:""}
    ${ap.review?`<span>Review</span><span>${esc(ap.review)}</span>`:""}
    ${ap.programs?`<span>Programs</span><span>${esc(ap.programs)}</span>`:""}
    ${ap.essays&&ap.essays.length?`<span>Essays</span><span>${ap.essays.map(esc).join("<br>")}</span>`:""}
    ${ap.cf_questions?`<span>C&amp;F questions</span><span>${ap.cf_questions}</span>`:""}
    ${n.status?`<span>Status</span><span>${esc(n.status)}</span>`:""}
  </div>
  ${ap.flags&&ap.flags.length?`<h3>Worth flagging</h3><ul class="flags">${ap.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
  ${s.current_cycle?`<h3>Newer school-published figures</h3><div class="note" style="color:var(--ink2)">${esc(s.current_cycle.text)}${s.current_cycle.source?` <a href="${s.current_cycle.source}" target="_blank" rel="noopener">source</a>`:""}</div>`:""}
  </div><div>`;
  if(lsd){
    h+=`<h3>LSD.Law applicants, ${prog}</h3>
    <div class="tw"><table><tr><th>Cycle</th><th class="n">Decided</th><th class="n">Accepted</th><th class="n">Acc. LSAT 25/50/75</th><th class="n">Acc. GPA 25/50/75</th><th class="n">Rej. med.</th><th class="n">Grant med.</th><th class="n">Days</th></tr>
    ${cyc.map(([c,v])=>`<tr><td>${c}${c==D.current_cycle?" ●":""}</td><td class="n">${v.decided}${v.waitlisted?` <small>(${v.waitlisted} WL)</small>`:""}</td><td class="n">${pct(v.accept_rate)}</td><td class="n">${tri(v.acc_lsat)}</td><td class="n">${tri(v.acc_gpa)}</td><td class="n">${v.rej_lsat_med??"–"} / ${v.rej_gpa_med??"–"}</td><td class="n">${usd(v.schol_med)}${v.schol_conditional_pct!=null?` <small>${v.schol_conditional_pct}% cond.</small>`:""}</td><td class="n">${v.days_med??"–"}</td></tr>`).join("")}
    </table></div>
    <div class="note">Grant = per-year, normalized (3-year totals ÷ 3). Days = application sent to decision, median.</div>
    <h3>Odds grid, GPA band × LSAT band (all cycles pooled)</h3>
    ${gridHtml(lsd)}
    <h3>Every reported applicant</h3>
    <div class="leg"><span><i style="background:var(--good)"></i>Accepted</span><span><i style="background:var(--warn)"></i>Waitlisted</span><span><i style="background:var(--bad)"></i>Rejected</span><span><i style="background:var(--you);border-radius:0"></i>You</span></div>
    <div id="sc-${s.id}"></div>`;
    if(proc) h+=`<div class="kv" style="margin-top:8px">${Object.entries(proc).map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join("")}</div>`;
  } else h+=`<h3>LSD.Law</h3><div class="note">No ${prog} page on LSD for this school${other?` (see ${prog=="Full-time"?"Part-time":"Full-time"})`:""}.</div>`;
  if(emp||bar) h+=`<h3>Outcomes (LSD summary of ABA employment + bar data)</h3><div class="kv">${emp?Object.entries(emp).filter(([k])=>/Bar Required|Total Employed|JD Advantage/.test(k)).map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join(""):""}${bar?Object.entries(bar).map(([k,v])=>`<span>${esc(k)} bar${(s.lsd["Full-time"].bar_label||"").replace("Bar Exam Performance","")}</span><span>${esc(v)}</span>`).join(""):""}</div>`;
  h+=`</div></div><div class="links"><a href="${s.aba_url}" target="_blank" rel="noopener">ABA 509 PDF</a>${lsd?`<a href="${lsd.url}" target="_blank" rel="noopener">LSD ${prog}</a>`:""}${other?`<a href="${other.url}" target="_blank" rel="noopener">LSD ${prog=="Full-time"?"Part-time":"Full-time"}</a>`:""}${n.url?`<a href="${n.url}" target="_blank" rel="noopener">Notion scrape</a>`:""}</div>`;
  return h;
}
function gridHtml(lsd){
  const pool={}; for(const c of Object.values(lsd.cycles)) for(const [k,v] of Object.entries(c.grid)){ pool[k]=pool[k]||[0,0]; pool[k][0]+=v[0]; pool[k][1]+=v[1]; }
  const yk=state.gpa!=null&&state.lsat!=null?gband(state.gpa)+"|"+lband(state.lsat):null;
  let h=`<div class="grid"><div class="h">GPA \\ LSAT</div>${LB.map(l=>`<div class="h">${l}</div>`).join("")}`;
  for(const g of [...GB].reverse()){ h+=`<div class="h">${g}</div>`; for(const l of LB){ const k=g+"|"+l, v=pool[k]; if(!v||v[1]<2){h+=`<div class="c">–${v?`<small>n=${v[1]}</small>`:""}</div>`;continue;} const p=100*v[0]/v[1], lv=p>=80?5:p>=60?4:p>=40?3:p>=20?2:1; h+=`<div class="c l${lv} ${k==yk?"you":""}">${Math.round(p)}%<small>n=${v[1]}</small></div>`; } }
  return h+`</div>`;
}
function drawScatter(id,prog){
  const s=D.schools.find(x=>x.id==id), lsd=s&&s.lsd[prog], el=document.getElementById("sc-"+id); if(!el||!lsd) return;
  const pts=[]; for(const [c,v] of Object.entries(lsd.cycles)) for(const r of v.rows) if(r[0]!=null&&r[1]!=null&&"ARW".includes(r[2])) pts.push({g:r[0],l:r[1],r:r[2],s:r[3],c:c,w:r[7]});
  const W=520,H=innerWidth<480?360:300,P={l:36,r:8,t:8,b:26}, x=l=>P.l+(l-140)/(180-140)*(W-P.l-P.r), y=g=>H-P.b-(Math.max(g,2)-2)/(4.33-2)*(H-P.t-P.b);
  const col={A:"var(--good)",W:"var(--warn)",R:"var(--bad)"};
  let h=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applicants by GPA and LSAT">`;
  for(let l=140;l<=180;l+=5) h+=`<line x1="${x(l)}" x2="${x(l)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--grid)"/><text x="${x(l)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="middle">${l}</text>`;
  for(let g=2;g<=4.3;g+=0.5) h+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--grid)"/><text x="${P.l-4}" y="${y(g)+3}" font-size="11" fill="var(--muted)" text-anchor="end">${g.toFixed(1)}</text>`;
  const a=s.aba["2025"], la=prog=="Part-time"&&a.lsat.pt[1]?a.lsat.pt:a.lsat.all, ga=prog=="Part-time"&&a.ugpa.pt[1]?a.ugpa.pt:a.ugpa.all;
  if(la[0]&&ga[0]) h+=`<rect x="${x(la[0])}" y="${y(ga[2])}" width="${x(la[2])-x(la[0])}" height="${y(ga[0])-y(ga[2])}" fill="none" stroke="var(--ink2)" stroke-dasharray="3 3"/><text x="${x(la[2])-2}" y="${y(ga[2])-3}" font-size="9" fill="var(--ink2)" text-anchor="end">509 25th-75th box</text>`;
  const order={R:0,W:1,A:2}; pts.sort((p,q)=>order[p.r]-order[q.r]);
  for(const p of pts){ const cx=x(p.l)+(Math.random()-.5)*3, cy=y(p.g)+(Math.random()-.5)*3, t=`${p.r=="A"?"Accepted":p.r=="W"?"Waitlisted":"Rejected"} · ${p.g} / ${p.l} · ${p.c}${p.s?" · "+usd(p.s)+"/yr":""}${p.w&&p.w!="-"?" · "+p.w:""}`;
    h+=p.r=="A"?`<circle cx="${cx}" cy="${cy}" r="3" fill="${col.A}" fill-opacity=".8" stroke="var(--surface)" stroke-width=".8" data-t="${esc(t)}"/>`:p.r=="W"?`<path d="M${cx} ${cy-4}L${cx+4} ${cy+3}L${cx-4} ${cy+3}Z" fill="${col.W}" stroke="var(--surface)" stroke-width="1" data-t="${esc(t)}"/>`:`<path d="M${cx-3} ${cy-3}L${cx+3} ${cy+3}M${cx+3} ${cy-3}L${cx-3} ${cy+3}" stroke="${col.R}" stroke-width="1.4" stroke-opacity=".75" data-t="${esc(t)}"/>`; }
  if(state.gpa!=null&&state.lsat!=null) h+=`<rect x="${x(state.lsat)-6}" y="${y(state.gpa)-6}" width="12" height="12" fill="var(--you)" stroke="#fff" stroke-width="2" data-t="You · ${state.gpa} / ${state.lsat}"/>`;
  h+=`<text x="${W/2}" y="${H-16}" font-size="10" fill="var(--muted)" text-anchor="middle">LSAT →</text><text transform="translate(9 ${H/2}) rotate(-90)" font-size="10" fill="var(--muted)" text-anchor="middle">GPA →</text></svg><div class="note">${pts.length} decided applicants across ${Object.keys(lsd.cycles).length} cycles. Hover or tap a mark.</div>`;
  el.innerHTML=h;
}
const tip=$("#tip");
document.addEventListener("pointermove",e=>{ const t=e.target.closest&&e.target.closest("[data-t]"); if(t){tip.textContent=t.dataset.t;tip.style.display="block";tip.style.left=Math.min(e.clientX+10,innerWidth-250)+"px";tip.style.top=(e.clientY+12)+"px";} else tip.style.display="none"; });
document.addEventListener("click",e=>{ const t=e.target.closest&&e.target.closest("[data-t]"); if(t){tip.textContent=t.dataset.t;tip.style.display="block";tip.style.left=Math.min(e.clientX+10,innerWidth-250)+"px";tip.style.top=(e.clientY+12)+"px";} });
function bind(){
  $("#gpa").addEventListener("change",e=>{state.gpa=e.target.value?+e.target.value:null;localStorage.gpa=state.gpa??"";render();});
  $("#lsat").addEventListener("change",e=>{state.lsat=e.target.value?+e.target.value:null;localStorage.lsat=state.lsat??"";render();});
  $("#sort").addEventListener("change",e=>{state.sort=e.target.value;localStorage.sort=state.sort;render();});
  document.querySelectorAll("#prog button").forEach(b=>b.addEventListener("click",()=>{state.prog=b.dataset.v;localStorage.prog=state.prog;render();}));
}
async function start(){
  if(window.__DATA__){ D=window.__DATA__; $("#app").hidden=false; bind(); render(); return; }
  $("#gate").hidden=false; const pw=$("#pw"); pw.focus();
  const go=async()=>{ try{ D=await decrypt(window.__ENC__, pw.value); sessionStorage.k=pw.value; $("#gate").hidden=true; $("#app").hidden=false; bind(); render(); }catch(e){ $("#gate-err").textContent="That didn't unlock it."; } };
  $("#unlock").addEventListener("click",go); pw.addEventListener("keydown",e=>{if(e.key=="Enter")go();});
  if(sessionStorage.k){ pw.value=sessionStorage.k; go(); }
}
async function decrypt(enc,pw){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(enc.salt),iterations:enc.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(enc.iv)},key,b(enc.ct));
  const ds=new DecompressionStream("gzip"); const w=ds.writable.getWriter(); w.write(pt); w.close();
  return JSON.parse(await new Response(ds.readable).text());
}
start();
