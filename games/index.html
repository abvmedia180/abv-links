<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1030">
<title>Games by Abie Papa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(ellipse at top,#1b2266 0%,#0d1030 60%) fixed;color:#fff;font-family:'Fredoka',system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 28px) 18px 28px;display:flex;flex-direction:column;align-items:center}
h1{font-family:'Bangers',cursive;font-size:clamp(3rem,14vw,4.5rem);letter-spacing:3px;color:#ffb627;text-shadow:3px 3px 0 #ff4d6d;margin-bottom:22px}
a.game{display:block;width:100%;max-width:520px;text-decoration:none;color:#fff;border-radius:26px;padding:22px;background:linear-gradient(145deg,#f58426,#ff4d6d);box-shadow:0 10px 0 #a3243d;margin-bottom:22px}
a.game:active{transform:translateY(5px);box-shadow:0 5px 0 #a3243d}
.k{font-family:'Bangers',cursive;letter-spacing:3px;opacity:.9}
.t{font-family:'Bangers',cursive;font-size:2.4rem;letter-spacing:2px;line-height:1.05}
.d{margin-top:6px;font-weight:600}
.e{font-size:3rem;float:right}
.soon{width:100%;max-width:520px;border:3px dashed #2a3170;border-radius:26px;padding:20px;color:#6b7199;text-align:center;font-weight:600}
</style>
</head>
<body>
<h1>GAMES<span style="display:block;font-size:.42em;letter-spacing:4px;color:#4cc9f0;text-shadow:none;margin-top:6px">BY ABIE PAPA</span></h1>
<a class="game" href="basketball/">
  <span class="e">🏀</span>
  <div class="k">GAME ONE</div>
  <div class="t">BASKETBALL GAME</div>
  <div class="d">Hear a jersey number, name the player!</div>
</a>
<div class="soon">Game Two coming soon...</div>
</body>
</html>
