<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Basketball Game">
<meta name="theme-color" content="#0d1030">
<title>Game One: Basketball Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1030;--card:#171c4a;--gold:#ffb627;--red:#ff4d6d;--green:#2ecc71;--blue:#4cc9f0;--dim:#a6accd;--knicks:#f58426}
html,body{background:radial-gradient(ellipse at top,#1b2266 0%,var(--bg) 60%) fixed;color:#fff;font-family:'Fredoka',system-ui,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);overflow-x:hidden;font-weight:500;font-kerning:normal;font-variant-ligatures:none;font-synthesis:none}
button,input{font-weight:600}
button{font-family:inherit;cursor:pointer;border:none}
.screen{display:none;flex-direction:column;align-items:center;max-width:560px;margin:0 auto;padding-top:18px}
.screen.on{display:flex}
h1{font-family:'Bangers',cursive;letter-spacing:2px;text-align:center;line-height:1}
.kicker{font-family:'Bangers',cursive;color:var(--blue);letter-spacing:3px;font-size:1.2rem}
.title{font-size:clamp(2.6rem,11vw,4.2rem);color:var(--gold);text-shadow:3px 3px 0 var(--red),6px 6px 0 rgba(0,0,0,.35);margin:4px 0 6px}
.ball{font-size:3.2rem;display:inline-block;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sub{color:var(--dim);margin-bottom:18px;text-align:center}
.panel{width:100%;background:rgba(23,28,74,.85);border:2px solid #2a3170;border-radius:20px;padding:16px;margin-bottom:14px}
.label{font-family:'Bangers',cursive;letter-spacing:1.5px;color:var(--gold);font-size:1.3rem;margin-bottom:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px 8px;border-radius:14px;background:#0f1338;color:var(--dim);font-size:1.1rem;font-weight:700;border:2px solid #2a3170}
.seg button.sel{background:linear-gradient(135deg,#ff9f1c,#ff4d6d);color:#fff;border-color:transparent}
.names{display:flex;gap:8px;margin-top:10px}
.names input{flex:1;min-width:0;padding:12px;border-radius:12px;border:2px dashed #4a5299;background:#0b0e2a;color:#fff;font:600 1rem 'Fredoka';text-align:left}
.names input::placeholder{color:#8990bf}
.names input:focus{outline:none;border-color:var(--blue)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle small{display:block;color:var(--dim);font-size:.85rem}
.sw{width:76px;height:44px;border-radius:22px;background:#2a3170;position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:'';position:absolute;top:5px;left:5px;width:34px;height:34px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{left:37px}
.tier{width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:#0f1338;color:#fff;border:3px solid #2a3170;margin-bottom:10px}
.tier b{font-family:'Bangers',cursive;font-size:1.4rem;letter-spacing:1.5px;color:var(--gold);font-weight:400}
.tier span{display:block;color:var(--dim);font-size:.9rem}
.tier.sel{border-color:var(--gold);box-shadow:0 0 18px rgba(255,182,39,.35)}
.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:4px}
.grid.on{display:grid}
.chip{padding:11px 6px;border-radius:12px;border:2px solid #2a3170;background:#0f1338;color:var(--dim);font-weight:700;text-align:center;user-select:none}
.chip.sel{color:#fff;border-color:var(--c,var(--gold));box-shadow:inset 0 0 0 2px var(--c,var(--gold));background:linear-gradient(135deg,rgba(255,182,39,.28),#171c4a)}
.chip.sel::before{content:'✓ ';color:var(--gold)}
.go{width:100%;padding:20px;border-radius:20px;background:linear-gradient(135deg,#ff9f1c,#ff4d6d);color:#fff;font-family:'Bangers',cursive;font-size:2.2rem;letter-spacing:3px;box-shadow:0 8px 0 #a3243d;margin:6px 0 10px}
.go:active{transform:translateY(4px);box-shadow:0 4px 0 #a3243d}
.go:disabled{opacity:.4}
.foot{color:#6b7199;font-size:.75rem;text-align:center;margin-top:8px}
/* game */
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.small{min-height:46px;padding:9px 14px;border-radius:12px;background:#0f1338;color:var(--dim);border:2px solid #2a3170;font-weight:600;font-size:.9rem}
.scores{width:100%;display:flex;gap:8px;margin-bottom:14px}
.sc{flex:1;padding:10px;border-radius:16px;background:#0f1338;border:3px solid #2a3170;text-align:center;transition:.25s}
.sc.turn{border-color:var(--gold);box-shadow:0 0 18px rgba(255,182,39,.4)}
.sc .n{font-weight:700;color:var(--dim);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .p{font-family:'Bangers',cursive;font-size:2.2rem;color:var(--gold);line-height:1}
.sc .s{font-size:.8rem;color:var(--gold);min-height:1em}
.card{width:100%;border-radius:28px;padding:22px 16px 18px;text-align:center;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.12)}
.team{font-family:'Bangers',cursive;font-size:clamp(1.8rem,8vw,2.6rem);letter-spacing:3px}
.num{font-family:'Bangers',cursive;font-size:clamp(7rem,34vw,10.5rem);line-height:.95;text-shadow:5px 5px 0 rgba(0,0,0,.35)}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.reveal{display:none;flex-direction:column;align-items:center;margin-top:6px}
.reveal.on{display:flex}
.reveal img{height:min(124px,20vh);aspect-ratio:350/254;object-fit:cover;object-position:top;border-radius:18px;background:rgba(255,255,255,.12)}
.reveal .who{font-family:'Bangers',cursive;font-size:1.8rem;letter-spacing:1.5px;margin-top:6px}
.tries{display:flex;gap:10px;justify-content:center;margin-top:8px;font-size:2rem}
.tries i{font-style:normal;transition:.3s}.tries i.used{opacity:.22;filter:grayscale(1);transform:scale(.8)}
#game.done .controls,#game.done .cap,#game.done .status,#game.done .heard,#game.done .typebox{display:none}
#game.done .num{font-size:clamp(4.5rem,20vw,7rem)}
#game.done .card{padding-bottom:12px}
.controls{width:100%;display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0 8px}
.mic{width:92px;height:92px;border-radius:50%;background:#0f1338;border:5px solid #555c8a;font-size:2.3rem;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.mic.talk{opacity:.45;filter:grayscale(1)}
.again.talk{animation:talk .8s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.mic.live{border-color:var(--green);background:#0f3a24;animation:pulse 1.4s infinite}
.mic.ready{border-color:var(--gold);background:#2a2410;animation:ready 1.1s ease-in-out infinite}
@keyframes ready{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,182,39,.6)}50%{transform:scale(1.08);box-shadow:0 0 0 16px rgba(255,182,39,0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}100%{box-shadow:0 0 0 26px rgba(46,204,113,0)}}
.again{width:70px;height:70px;border-radius:50%;background:#0f1338;border:4px solid var(--blue);font-size:1.9rem}
.giveup{width:70px;height:70px;border-radius:50%;background:#0f1338;border:4px solid #555c8a;font-size:1.9rem}
.cap{display:flex;gap:10px;justify-content:center;width:100%;color:#c9cdf5;font-size:.85rem;font-weight:600;text-align:center}
.cap div{width:92px;white-space:nowrap}.cap div:first-child,.cap div:last-child{width:70px}
.status{min-height:1.4em;color:#c9cdf5;margin-top:14px;text-align:center}
.heard{min-height:1.3em;color:var(--blue);font-style:italic;text-align:center}
.msg{width:100%;margin-top:12px;padding:14px;border-radius:18px;text-align:center;font-size:1.2rem;font-weight:600;display:none;text-wrap:balance}
.msg.on{display:block;animation:pop .35s ease-out}
.msg.ok{background:#1f9d57;border:2px solid #2ecc71;color:#fff;font-weight:700;font-size:clamp(1.25rem,5.5vw,1.6rem)}
.typebox{margin-bottom:10px}
@media (min-width:700px){
  .screen{max-width:640px}
  .mic{width:120px;height:120px;font-size:3rem}.again,.giveup{width:92px;height:92px;font-size:2.4rem}
  .cap div{width:120px}.cap div:first-child,.cap div:last-child{width:92px}
  .num{font-size:12rem}
}
@media (min-width:700px) and (max-height:820px){ .num{font-size:8rem} .card{padding:14px 16px 12px} .controls{margin:10px 0 4px} }
@media (min-width:900px) and (orientation:landscape){
  #game.done .card{display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:10px}
  #game.done .team,#game.done .tries{grid-column:1/-1}
  #game.done .num{font-size:8rem}
  #game.done .reveal{margin:0}
}
.msg.hint{background:rgba(76,201,240,.12);border:2px solid var(--blue)}
.msg.rv{background:rgba(155,93,229,.14);border:2px solid #9b5de5}
.turnb{width:100%;text-align:center;font-family:'Bangers',cursive;letter-spacing:2px;font-size:1.7rem;padding:6px;margin:-4px 0 10px;border:3px solid;border-radius:16px;background:rgba(0,0,0,.25);animation:pop .4s ease-out}
.reveal img{transition:filter .6s}
.reveal.blur img{filter:blur(9px)}.reveal.blur2 img{filter:blur(4px)}
.sc.bump .p{animation:bump .7s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.6);color:#fff}100%{transform:scale(1)}}
/* phone turned sideways: number card left, controls right, so the mic never falls off the screen */
@media (orientation:landscape) and (max-height:500px){
  .screen#game{max-width:900px;display:none;grid-template-columns:1fr 1fr;column-gap:16px;align-items:start;padding-top:8px}
  .screen#game.on{display:grid}
  #game .top,#game .scores,#game .turnb{grid-column:1/-1;margin-bottom:6px}
  #game .card{grid-column:1;grid-row:span 6;padding:10px 12px}
  #game .num{font-size:5.5rem}#game .team{font-size:1.6rem}
  #game .controls,#game .cap,#game .status,#game .heard,#game .msg,#game .next,#game .typebox,#game #dbg{grid-column:2}
  #game .controls{margin:4px 0}
  #game .reveal img{height:96px}
  #game.done .num{font-size:4rem} #game.done .card{padding:8px 12px}
  #game .top{margin-bottom:4px} #game .small{padding:4px 12px;font-size:.8rem}
  #game .sc{padding:4px 8px} #game .sc .p{font-size:1.5rem} #game .sc .s{display:none}
  #game .turnb{font-size:1.2rem;padding:2px;margin:0 0 6px}
  #game .mic{width:96px;height:96px;font-size:2.4rem}
  #game .again,#game .giveup{width:72px;height:72px;font-size:1.9rem}
  #game .cap div{width:96px} #game .cap div:first-child,#game .cap div:last-child{width:72px}
}
/* hint photo showing: shrink the number like the end-of-round card so everything fits at real Safari heights */
#game:has(.reveal.on) .num{font-size:clamp(4.5rem,20vw,7rem)}
.reveal img{height:min(124px,16vh)}
.reveal.blur img,.reveal.blur2 img{background:transparent;transform:scale(1.05)}
.again{border-color:#555c8a}
.again.talk{border-color:var(--blue);box-shadow:0 0 0 6px rgba(76,201,240,.25)}
.next{scroll-margin-bottom:16px}
html{overflow-x:hidden}
body{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media (orientation:landscape) and (max-height:500px){ #game:has(.reveal.on) .num{font-size:4rem} }
.pts{font-family:'Bangers',cursive;letter-spacing:1px;font-size:clamp(1.6rem,7vw,2.2rem);margin-bottom:4px}
.typebox{width:100%;display:flex;gap:8px;margin-top:12px}
.typebox input{flex:1;min-width:0;padding:13px;border-radius:14px;border:2px solid #2a3170;background:#0f1338;color:#fff;font:600 1.05rem 'Fredoka'}
.typebox button{padding:0 18px;border-radius:14px;background:var(--blue);color:#0d1030;font-weight:700;font-size:1.05rem}
.next{display:none;width:100%;margin-top:12px}
.next.on{display:block}
/* hands-free: blue "thinking" mic, first-load progress bar, tap-to-wake cover */
.mic.think{border-color:var(--blue);background:#0f2a3a;animation:think .9s ease-in-out infinite}
@keyframes think{50%{transform:scale(.9)}}
.ears{display:none;width:100%;margin-top:8px;text-align:center;color:#c9cdf5;font-size:.9rem}
.ears.on{display:block}
.ears b{display:block;height:10px;margin-top:5px;border-radius:6px;background:#0f1338;overflow:hidden}
.ears i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .4s}
.wake{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(13,16,48,.94);text-align:center;color:var(--dim)}
.wake.on{display:flex}
.wake .go{max-width:420px;padding:34px 20px}
.confetti{position:fixed;top:-12px;z-index:50;pointer-events:none;animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(760deg);opacity:.2}}
</style>
</head>
<body>

<section class="screen on" id="setup">
  <div class="ball">🏀</div>
  <div class="kicker">GAMES BY ABIE PAPA &middot; GAME ONE</div>
  <h1 class="title">BASKETBALL GAME</h1>
  <p class="sub">I say a jersey number. You say the player!</p>

  <div class="panel">
    <div class="label">WHO'S PLAYING?</div>
    <div class="seg" id="modeSeg">
      <button data-m="1">1 Player</button>
      <button data-m="2">2 Players</button>
    </div>
    <div class="names" id="names">
      <input id="n1" maxlength="14" placeholder="Player 1">
      <input id="n2" maxlength="14" placeholder="Player 2">
    </div>
  </div>

  <div class="panel toggle" id="starsRow">
    <div><div class="label" style="margin:0">STARS ONLY ⭐</div><small>Just the famous players.</small></div>
    <div class="sw" id="starsSw"></div>
  </div>

  <div class="panel toggle" id="hfRow">
    <div><div class="label" style="margin:0">HANDS-FREE 🎤</div><small id="hfNote">Just talk. No tapping the mic.</small></div>
    <div class="sw" id="hfSw"></div>
  </div>

  <div class="panel">
    <div class="label">PICK YOUR TEAMS</div>
    <button class="tier" data-t="1"><b>TIER 1</b><span>Knicks, Lakers, Spurs, Thunder</span></button>
    <button class="tier" data-t="2"><b>TIER 2: ALL TEAMS</b><span>All 16 teams. Think you can handle it?</span></button>
    <button class="tier" data-t="c"><b>PICK MY OWN</b><span>Tap the teams you want</span></button>
    <div class="grid" id="grid"></div>
  </div>

  <button class="go" id="goBtn">LET'S GO!</button>
  <div class="foot" id="foot"></div>
</section>

<section class="screen" id="game">
  <div class="top">
    <button class="small" id="backBtn">⬅ Teams</button>
    <button class="small" id="resetBtn">↺ Reset score</button>
  </div>
  <div class="scores" id="scores"></div>
  <div class="turnb" id="turnBanner" style="display:none"></div>

  <div class="card" id="card">
    <div class="team" id="teamName"></div>
    <div class="num" id="num"></div>
    <div class="reveal" id="reveal"><img id="photo" alt=""><div class="who" id="who"></div></div>
    <div class="tries" id="tries"><i>🏀</i><i>🏀</i><i>🏀</i></div>
  </div>

  <div class="controls">
    <button class="again" id="againBtn" aria-label="Say it again">🔊</button>
    <button class="mic" id="micBtn" aria-label="Talk">🎤</button>
    <button class="giveup" id="giveBtn" aria-label="Tell me">🤷</button>
  </div>
  <div class="cap"><div>Again</div><div id="capMic">Tap &amp; talk</div><div>Tell me</div></div>
  <div class="status" id="status"></div>
  <div class="ears" id="ears"><span id="earsTxt"></span><b><i id="earsBar"></i></b></div>
  <div class="heard" id="heard"></div>
  <div class="msg" id="msg"></div>
  <button class="go next" id="nextBtn">NEXT PLAYER ➜</button>
  <pre id="dbg" style="display:none;width:100%;margin-top:10px;padding:8px;border-radius:10px;background:#000;color:#7CFC9A;font:12px/1.35 ui-monospace,monospace;white-space:pre-wrap;max-height:180px;overflow:auto"></pre>
  <div class="typebox"><input id="typeIn" placeholder="Or type a name..." autocomplete="off" autocapitalize="words"><button id="typeBtn">Go</button></div>
</section>

<div class="wake" id="wake"><button class="go" id="wakeBtn">👆 TAP TO KEEP PLAYING</button><p>The game took a little nap.</p></div>

<script src="data.js"></script>
<script>
const D = window.GAME_DATA;
const TEAMS = {
  Knicks:["#f58426","#006bb6",1], Lakers:["#fdb927","#552583",1], Spurs:["#c4ced4","#1a1a1a",1], Thunder:["#ef6100","#007ac1",1],
  Celtics:["#ffffff","#007a33",2], "76ers":["#ffffff","#006bb6",2], Heat:["#f9a01b","#98002e",2], Cavaliers:["#fdbb30","#860038",2],
  Warriors:["#ffc72c","#1d428a",2], Mavericks:["#b8c4ca","#00538c",2], Bucks:["#eee1c6","#00471b",2], Nuggets:["#fec524","#0e2240",2],
  Suns:["#e56020","#1d1160",2], Bulls:["#ffffff","#ce1141",2], Timberwolves:["#78be20","#0c2340",2], Rockets:["#ffffff","#ce1141",2]
};
const TIER1 = ["Knicks","Lakers","Spurs","Thunder"];
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];

// ---------- saved state ----------
const saved = JSON.parse(localStorage.getItem("bbgame") || "{}");
const S = {
  mode: saved.mode || 1, stars: !!saved.stars, tier: saved.tier || "1",
  custom: saved.custom || TIER1.slice(),
  names: saved.names || ["", ""],
  score: saved.score || [{p:0,st:0,best:0},{p:0,st:0,best:0}],
  hf: saved.hf !== false,   // hands-free is the main mode: on unless turned off
};
const save = () => localStorage.setItem("bbgame", JSON.stringify({mode:S.mode,stars:S.stars,tier:S.tier,custom:S.custom,names:S.names,score:S.score,hf:S.hf}));
const nameOf = i => (S.names[i] || "").trim() || `Player ${i+1}`;

// ---------- setup screen ----------
function drawSetup(){
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("sel", +b.dataset.m === S.mode));
  $("n2").style.display = S.mode === 2 ? "" : "none";
  $("n1").placeholder = S.mode === 2 ? "🔵 Blue player's name" : "✏️ Your name (optional)";
  $("n2").placeholder = "🟠 Orange player's name";
  $("n1").value = S.names[0]; $("n2").value = S.names[1];
  $("starsSw").classList.toggle("on", S.stars);
  $("hfSw").classList.toggle("on", S.hf && !TAP_ONLY);
  $("hfNote").textContent = TAP_ONLY ? "Off for this link (?tap)." : hfPaused() ? "Resting on this phone for a day. Tap 🎤 works." : "Just talk. No tapping the mic.";
  document.querySelectorAll(".tier").forEach(b => b.classList.toggle("sel", b.dataset.t === S.tier));
  $("grid").classList.toggle("on", S.tier === "c");
  const g = $("grid"); g.innerHTML = "";
  Object.keys(TEAMS).forEach(t => {
    const c = document.createElement("div");
    c.className = "chip" + (S.custom.includes(t) ? " sel" : "");
    c.style.setProperty("--c", TEAMS[t][0] === "#ffffff" ? TEAMS[t][1] : TEAMS[t][0]);
    c.textContent = t;
    c.onclick = () => { S.custom = S.custom.includes(t) ? S.custom.filter(x => x !== t) : [...S.custom, t]; save(); drawSetup(); };
    g.appendChild(c);
  });
  $("goBtn").disabled = teamsChosen().length === 0;
}
function teamsChosen(){ return S.tier === "1" ? TIER1 : S.tier === "2" ? Object.keys(TEAMS) : S.custom; }
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => { S.mode = +b.dataset.m; save(); drawSetup(); });
document.querySelectorAll(".tier").forEach(b => b.onclick = () => { S.tier = b.dataset.t; save(); drawSetup(); });
$("starsSw").onclick = () => { S.stars = !S.stars; save(); drawSetup(); };
$("hfSw").onclick = () => { if (TAP_ONLY) return; S.hf = !S.hf; if (S.hf) localStorage.removeItem("hfSkipUntil"); save(); drawSetup(); };
$("n1").oninput = e => { S.names[0] = e.target.value; save(); };
$("n2").oninput = e => { S.names[1] = e.target.value; save(); };
$("foot").textContent = `Rosters: ${D.season} season, checked ${D.built.slice(0,10)}. ${D.players.length} players.`;

// ---------- audio ----------
const audio = new Audio(); audio.preload = "auto";

  if (m.type === "clip"){
    H.clips++; dbg(`vad end @${m.t}ms: clip ${m.ms}ms, voiced ${m.voicedMs}ms, peak ${m.peak}`);
    if (G.state === "ask" && !speaking && hfLive()) hfSend(m);
  }
}
function hfSend(m){
  if (H.busy){ H.queued = m; return; }
  H.busy = true; clearTimeout(idleTimer);
  $("micBtn").classList.remove("live"); $("micBtn").classList.add("think"); $("status").textContent = "🤔 Thinking...";
  H.worker.postMessage({ type: "clip", id: H.epoch, pcm: m.pcm, sr: m.sr }, [m.pcm.buffer]);
}
// green mic, and the same gentle re-ask as tap mode when nobody says anything (twice, then just keep listening)
function hfListen(){
  clearTimeout(idleTimer);
  if (G.state !== "ask" || speaking) return;
  $("micBtn").classList.remove("ready", "think"); setMic(true, "🎤 I'm listening... just say the name!");
  idleTimer = setTimeout(() => {
    if (G.state !== "ask" || speaking || H.busy || idleCount >= 2) return;
    idleCount++; hfNote("idle");
    say([[`g-wait${idleCount}`, D.generic[`wait${idleCount}`]], [`q-${G.p.id}`, qText()]], listen);
  }, HF_IDLE_MS);
}
// the mic ignores everything while the game talks, plus a short tail for the room echo
function gate(shut){
  clearTimeout(H.gateT);
  if (!H.node) return;
  if (shut){ H.epoch++; H.queued = null; H.node.port.postMessage({ gate: true }); return; }
  H.gateT = setTimeout(() => { if (!speaking && G.state === "ask" && hfLive()) H.node.port.postMessage({ gate: false }); }, TAIL_MS);
}
// Whisper invents words in silence ("you", "thank you", "[BLANK_AUDIO]"), and capitalizes every new sentence,
// which looksLikeName would read as a name. So: drop bracketed bits and known ghosts, join sentences in lower case.
const GHOSTS = new Set(["you", "thank you", "thanks", "thank you so much", "thanks for watching", "thank you for watching", "bye", "bye bye", "oh", "so", "okay", "hmm", "the end", "you you"]);
function hfClean(t){
  t = (t || "").replace(/\[[^\]]*\]|\([^)]*\)|\*[^*]*\*|[♪♫]/g, " ")
    .replace(/[.!?;:]+\s*([A-Za-z]?)/g, (m, c) => " " + c.toLowerCase()).replace(/\s+/g, " ").trim();
  return !/[a-z0-9]/i.test(t) || GHOSTS.has(norm(t)) ? "" : t;
}
function hfSleep(why){
  if (!H.stream || H.asleep) return;
  H.asleep = true; dbg("asleep: " + why); hfNote("sleep");
  hush(); pauseListening(); gate(true);
  if ($("game").classList.contains("on")) $("wake").classList.add("on"); else H.asleep = false;
}
$("wakeBtn").onclick = () => {
  $("wake").classList.remove("on"); H.asleep = false;
  if (H.ctx) H.ctx.resume().catch(() => {});
  const tr = H.stream && H.stream.getAudioTracks()[0];
  if (!tr || tr.readyState === "ended") navigator.mediaDevices.getUserMedia(MIC_OPTS).then(hfMic, e => hfFail("mic again " + e.name));
  wakeLock(); idleCount = 0;
  if (G.state === "ask") sayAgain();
};
document.addEventListener("visibilitychange", () => { if (document.hidden) hfSleep("page hidden"); });
// give the mic back and fall back to tap-to-talk (Web Speech), keeping the game going
function hfStop(){
  if (H.worker) H.worker.terminate();
  if (H.stream) H.stream.getTracks().forEach(t => t.stop());
  if (H.ctx) H.ctx.close().catch(() => {});
  Object.assign(H, { worker:null, stream:null, ctx:null, node:null, srcNode:null, src:null, bufs:{}, ready:false, busy:false, asleep:false, queued:null });
  try { if (navigator.audioSession) navigator.audioSession.type = "auto"; } catch(e){}
  sessionStorage.removeItem("whisperLoading"); ears(null); $("capMic").textContent = "Tap & talk";
}
function hfFail(why, msg){
  dbg("hands-free off: " + why); H.failed = why; hfNote("fail");
  hfStop();
  if (G.state === "ask" && !speaking && !rec){ listen(); if (msg) $("status").textContent = msg; }
}

// ---------- game ----------
const G = { p:null, tries:0, turn:0, used:new Set(), state:"idle" };
const qText = () => `Number ${G.p.number === "00" ? "double zero" : G.p.number} on the ${G.p.team === "76ers" ? "Sixers" : G.p.team}! Who is it?`;

function drawScores(){
  const box = $("scores"); box.innerHTML = "";
  for (let i = 0; i < S.mode; i++){
    const s = S.score[i], d = document.createElement("div");
    d.className = "sc" + (S.mode === 2 && G.turn === i ? " turn" : "");
    if (S.mode === 2) d.style.borderColor = G.turn === i ? SIDE[i].c : "";
    d.innerHTML = `<div class="n"></div><div class="p">${s.p}</div><div class="s">${s.st >= 2 ? "🔥 " + s.st + " in a row" : s.best ? "Best: " + s.best : ""}</div>`;
    d.querySelector(".n").textContent = S.mode === 2 ? `${SIDE[i].e} ${(S.names[i] || "").trim() || SIDE[i].n}` : nameOf(i);
    box.appendChild(d);
  }
  const tb = $("turnBanner");
  tb.style.display = S.mode === 2 ? "" : "none";
  if (S.mode === 2){ tb.textContent = `${SIDE[G.turn].e} ${SIDE[G.turn].n.toUpperCase()}, YOUR TURN!`; tb.style.color = SIDE[G.turn].c; tb.style.borderColor = SIDE[G.turn].c; }
}
// Two players: each kid is a color, so nobody has to read or know "player two" (and no real names in the public repo)
const SIDE = [{e:"🔵", n:"Blue", c:"#4cc9f0"}, {e:"🟠", n:"Orange", c:"#f58426"}];
const photoUrl = p => `https://a.espncdn.com/i/headshots/nba/players/full/${p.id}.png`;
function pool(){
  const teams = teamsChosen();
  let ps = D.players.filter(p => teams.includes(p.team) && (!S.stars || p.star));
  let fresh = ps.filter(p => !G.used.has(p.id));
  if (!fresh.length){ G.used.clear(); fresh = ps; G.allSeen = true; }
  const weighted = []; fresh.forEach(p => { weighted.push(p); if (p.star) weighted.push(p, p); });
  return weighted;
}
function newRound(first){
  hush(); stopListening();
  G.p = (window.__forcePlayer && D.players.find(p => p.name === window.__forcePlayer)) || pick(pool()); G.used.add(G.p.id);   // __forcePlayer: test hook
  // hands-free voice: keep decoded clips for this round only (plus the shared lines), and fetch the likely ones now
  if (H.ctx){ for (const k in H.bufs) if (!k.includes("/g-")) delete H.bufs[k]; ["q", "ok", "h2"].forEach(k => clipBuf(`audio/${k}-${G.p.id}.mp3`).catch(() => {})); } G.tries = 0; G.state = "ask"; idleCount = 0; missCount = 0;
  $("game").classList.remove("done"); window.scrollTo(0, 0);
  const [fg, bg] = TEAMS[G.p.team];
  $("card").style.background = `linear-gradient(160deg, ${bg} 0%, #0b0e2a 95%)`;
  $("teamName").textContent = G.p.team.toUpperCase(); $("teamName").style.color = fg;
  const n = $("num"); n.textContent = G.p.number; n.style.color = fg;
  n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop");
  $("reveal").classList.remove("on", "blur", "blur2"); $("num").style.display = "";
  // preload the photo: it is hint 1 (blurry), so only use it if it really loads
  G.photoOk = false; { const im = new Image(), id = G.p.id; im.onload = () => { if (G.p && G.p.id === id) G.photoOk = true; }; im.src = photoUrl(G.p); }
  document.querySelectorAll("#tries i").forEach(i => i.classList.remove("used"));
  $("msg").className = "msg"; $("nextBtn").classList.remove("on"); $("heard").textContent = "";
  $("typeIn").value = ""; $("giveBtn").disabled = false;
  drawScores();
  const items = [];
  if (first) items.push(["g-hello", D.generic.hello]);
  if (G.allSeen){ items.push(["g-allseen", D.generic.allseen]); G.allSeen = false; }
  if (S.mode === 2) items.push([`g-p${G.turn+1}`, `${SIDE[G.turn].n} team, you're up!`]);
  items.push([`q-${G.p.id}`, qText()]);
  say(items, listen);
}
const nb = s => s.replace(/Go Knicks/g, "Go Knicks").replace(/Let's GOOO/g, "Let's GOOO")
  .replace(/with "(.)"/g, 'with "$1"').replace(/ (\S+)$/, " $1");
function showMsg(text, cls){ const m = $("msg"); m.textContent = nb(text); m.className = "msg on " + cls; }
// only scroll when the Next button is actually off screen (scrolling otherwise hides the score)
function showNext(){ requestAnimationFrame(() => { const b = $("nextBtn"), r = b.getBoundingClientRect(); if (r.bottom > innerHeight - 8 || r.top < 0) b.scrollIntoView({block: "end", behavior: "smooth"}); }); }
function showReveal(){
  const img = $("photo");
  img.onload = showNext;
  img.onerror = () => { img.style.display = "none"; showNext(); };
  img.style.display = "";
  $("reveal").classList.remove("blur", "blur2");
  img.src = photoUrl(G.p);
  $("who").textContent = G.p.name;
  $("reveal").classList.add("on");
}
// hint photo: blurry after try 1, less blurry after try 2
function showBlurred(level){
  const img = $("photo"); img.onload = img.onerror = null; img.style.display = "";
  img.src = photoUrl(G.p); $("who").textContent = "";
  $("reveal").classList.remove("blur", "blur2"); $("reveal").classList.add("on", level === 1 ? "blur" : "blur2");
}
function endRound(delay = 0){
  G.state = "done"; stopListening(); $("game").classList.add("done"); $("nextBtn").classList.add("on"); $("giveBtn").disabled = true; drawScores(); save();
  if (S.mode === 2){ const tb = $("turnBanner"), o = SIDE[1 - G.turn]; tb.textContent = `NEXT: ${o.e} ${o.n.toUpperCase()}!`; tb.style.color = o.c; tb.style.borderColor = o.c; }
  if (delay) setTimeout(() => { if (G.state === "done") showNext(); }, delay); else showNext();
}

function onSpeech(alts, final, near){
  if (G.state !== "ask" || speaking) return;
  armIdle();
  if (alts.some(t => isRight(t, G.p))) return correct();
  if (!final) return;
  if (near && !alts.some(isNameGuess)) return correct();   // hands-free: sounds like HIS name, and no other player was named
  const t = alts[0];
  if (wantsAgain(t)) return sayAgain();
  if (wantsHelp(t)) return giveUp();
  if (alts.some(isNameGuess) || looksLikeName(t)) return wrong();
  $("status").textContent = "🎤 I'm listening... say a player!";   // not a name: ignore, keep listening
}
function correct(){
  const s = S.score[G.turn]; s.p++; s.st++; s.best = Math.max(s.best, s.st);
  const knicks = G.p.team === "Knicks";
  const key = knicks ? `nyk${1+Math.floor(Math.random()*5)}` : `ok${1+Math.floor(Math.random()*8)}`;
  const items = [[`g-${key}`, D.generic[key]], [`ok-${G.p.id}`, `That's ${G.p.name}!`]];
  if (s.st >= 3) { const k = `s${Math.min(s.st,10)}`; items.push([`g-${k}`, D.generic[k]]); }
  showMsg(`${D.generic[key]} That's ${G.p.name}!` + (s.st >= 3 ? " " + D.generic[`s${Math.min(s.st,10)}`] : ""), "ok");
  showReveal(); confetti(); endRound(900);
  // the score going up is the best part: bounce it while the scores are still on screen, then scroll to Next
  const sc = $("scores").children[G.turn]; if (sc){ sc.classList.add("bump"); }
  $("msg").insertAdjacentHTML("afterbegin", `<div class="pts">⭐ ${S.mode === 2 ? SIDE[G.turn].e + " " : ""}${s.p} POINT${s.p === 1 ? "" : "S"}!</div>`);
  say(items);
}
function wrong(){
  G.tries++;
  document.querySelectorAll("#tries i").forEach((i, k) => i.classList.toggle("used", k < G.tries));
  if (G.tries >= 3) return reveal();
  const no = `no${1+Math.floor(Math.random()*4)}`, first = G.p.name.split(" ")[0];
  let hint;
  if (G.tries === 1 && G.photoOk){ showBlurred(1); hint = ["g-pic", D.generic.pic]; }
  else if (G.tries === 1) hint = [`h1-${G.p.id}`, G.p.hint1 || `Here's a hint! His first name starts with ${first[0].toUpperCase()}.`];
  else { if (G.photoOk) showBlurred(2); hint = [`h2-${G.p.id}`, `Big hint! His first name is ${first}!`]; }
  showMsg(`${D.generic[no]} ${hint[1]}`, "hint");
  // scroll only after the pop animation, or it measures the shrunken box and leaves the hint cut off
  $("msg").addEventListener("animationend", () => $("msg").scrollIntoView({block: "nearest", behavior: "smooth"}), {once: true});
  wantListen = false; dropRec();
  say([[`g-${no}`, D.generic[no]], hint], listen);
}
function reveal(){
  S.score[G.turn].st = 0;
  showMsg(`That was ${G.p.name}! You'll get the next one!`, "rv");
  showReveal(); endRound();
  say([[`rv-${G.p.id}`, `That was ${G.p.name}! You'll get the next one!`]]);
}
function giveUp(){ if (G.state === "ask") reveal(); }
function sayAgain(){ if (!G.p) return; wantListen = false; dropRec(); say([[`q-${G.p.id}`, qText()]], () => { if (G.state === "ask") listen(); }); }
function nextPlayer(){ if (S.mode === 2) G.turn = 1 - G.turn; newRound(false); }

function confetti(){
  const cs = ["#ffb627","#ff4d6d","#2ecc71","#4cc9f0","#f58426","#ffffff"];
  for (let i = 0; i < 40; i++){
    const c = document.createElement("div"); c.className = "confetti";
    const sz = 7 + Math.random()*9;
    Object.assign(c.style, { left: Math.random()*100+"vw", width: sz+"px", height: sz+"px",
      background: pick(cs), borderRadius: Math.random() > .5 ? "50%" : "3px", animationDelay: Math.random()*.4+"s" });
    document.body.appendChild(c); setTimeout(() => c.remove(), 3400);
  }
}

// ---------- wiring ----------
$("goBtn").onclick = () => {
  hfStart();   // must run inside this tap: audio session, AudioContext, mic, wake lock, model download
  G.used.clear(); G.turn = 0;
  $("setup").classList.remove("on"); $("game").classList.add("on"); window.scrollTo(0,0);
  newRound(true);
};
$("backBtn").onclick = () => { hush(); stopListening(); G.state = "idle"; $("game").classList.remove("on"); $("setup").classList.add("on"); drawSetup(); };
$("resetBtn").onclick = () => {
  if (!confirm("Reset the score back to zero?")) return;
  S.score = [{p:0,st:0,best:0},{p:0,st:0,best:0}]; save(); drawScores();
};
// A second tap never turns the mic off (kids double-tap). Taps right after starting are ignored; a later tap restarts fresh.
$("micBtn").onclick = () => {
  if (G.state !== "ask" || Date.now() - talkAt < 800) return;
  idleCount = 0;
  if (hfLive()){ if (!H.busy){ hush(); hfListen(); } return; }   // hands-free: a tap just stops the game talking
  talk();
};
$("againBtn").onclick = sayAgain;
$("giveBtn").onclick = giveUp;
$("nextBtn").onclick = nextPlayer;
const typed = () => { const t = $("typeIn").value.trim(); if (!t || G.state !== "ask") return; $("typeIn").value = "";
  $("heard").textContent = `"${t}"`;
  if (isRight(t, G.p)) return correct();
  if (wantsAgain(t)) return sayAgain();
  if (wantsHelp(t)) return giveUp();
  if (isNameGuess(t) || looksLikeName(t, true)) return wrong();   // typed "um" doesn't use a try
};
$("typeBtn").onclick = typed;
$("typeIn").onkeydown = e => { if (e.key === "Enter") typed(); };
if ("speechSynthesis" in window) speechSynthesis.getVoices();
if (DEBUG) { $("dbg").style.display = "block"; dbg(`ua ${navigator.userAgent.slice(0,70)} | SR ${!!SR} | ios ${IOS} | hands-free ${hfWanted()}${hfPaused() ? " (paused)" : ""}`); }
drawSetup();
</script>
</body>
</html>
