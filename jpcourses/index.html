<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>JP Minicourses</title>
<style>
  :root{--jp-forest:#0f3d1c;--jp-sage:#d8e4ca;--jp-beige:#eeede4;--neutral:#6B7280;--clinical-red:#8B1A1A;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--jp-beige);font-family:Georgia,"Source Serif Pro",serif;color:#1f2937;padding:16px;}
  .gate{width:100%;max-width:420px;background:#fff;padding:36px 32px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);border-left:6px solid var(--jp-forest);}
  .gate-logo{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--jp-forest);color:#fff;font-family:'Inter',-apple-system,sans-serif;font-weight:700;font-size:16px;border-radius:8px;margin-bottom:16px;}
  h1{font-family:'Inter',-apple-system,sans-serif;font-size:22px;margin:0 0 6px;color:var(--jp-forest);}
  .sub{font-size:14px;color:var(--neutral);margin:0 0 24px;}
  label{display:block;font-family:'Inter',-apple-system,sans-serif;font-size:12px;font-weight:600;color:var(--jp-forest);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;}
  input[type="password"]{width:100%;padding:12px 14px;font-size:16px;font-family:Georgia,serif;border:2px solid #e5e7eb;border-radius:8px;outline:none;transition:border-color .15s;}
  input[type="password"]:focus{border-color:var(--jp-forest);}
  button{width:100%;margin-top:14px;padding:12px;font-family:'Inter',-apple-system,sans-serif;font-weight:600;font-size:15px;color:#fff;background:var(--jp-forest);border:none;border-radius:8px;cursor:pointer;transition:background .15s;}
  button:hover{background:#0a2f15;} button:disabled{background:#9ca3af;cursor:not-allowed;}
  .err{margin-top:12px;font-size:13px;color:var(--clinical-red);min-height:18px;}
  .foot{margin-top:20px;font-size:12px;color:var(--neutral);text-align:center;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:6px;vertical-align:middle;animation:r .7s linear infinite;}
  @keyframes r{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<main class="gate" aria-labelledby="gate-title">
  <div class="gate-logo">JP</div>
  <h1 id="gate-title">JP Minicourses</h1>
  <p class="sub">Internal clinician training. Enter the staff password to access.</p>
  <form id="gate-form" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autofocus autocomplete="off" inputmode="text">
    <button id="submit" type="submit">Unlock</button>
    <div id="err" class="err" role="alert"></div>
  </form>
  <p class="foot">Joseph Psychiatry &mdash; for PA and NP onboarding</p>
</main>

<script>
(function(){
  "use strict";
  const blob=JSON.parse(document.getElementById("blob").textContent);
  const form=document.getElementById("gate-form"),pw=document.getElementById("pw"),btn=document.getElementById("submit"),err=document.getElementById("err");
  let attempts=0;const MAX=5;
  function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
  async function deriveKey(p,salt,iters){const enc=new TextEncoder();const km=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iters,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);}
  async function tryDecrypt(p){const salt=b64ToBytes(blob.salt),iv=b64ToBytes(blob.iv),ct=b64ToBytes(blob.ct);const key=await deriveKey(p,salt,blob.iterations);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);return new TextDecoder().decode(pt);}
  form.addEventListener("submit",async function(e){
    e.preventDefault();
    if(attempts>=MAX){err.textContent="Too many attempts. Refresh the page to retry.";return;}
    const p=pw.value;if(!p){err.textContent="Enter a password.";return;}
    btn.disabled=true;btn.innerHTML='<span class="spin"></span>Unlocking';err.textContent="";
    try{const html=await tryDecrypt(p);document.open();document.write(html);document.close();}
    catch(ex){attempts++;btn.disabled=false;btn.textContent="Unlock";err.textContent=attempts>=MAX?"Too many attempts. Refresh to retry.":`Wrong password (${MAX-attempts} attempt${(MAX-attempts)===1?"":"s"} left)`;pw.select();}
  });
})();
</script>
