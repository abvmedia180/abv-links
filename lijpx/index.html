<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="pxhub-manifest" content="manifest.json?v=928710503d">
<title>Secure Dashboard</title>
<link rel="icon" href="favicon.svg?v=8bb1f5b205" type="image/svg+xml">
<link rel="stylesheet" href="styles/shell.css?v=482fa44bcc">
<link rel="stylesheet" href="styles/print.css?v=b23ae62a0b" media="print">
<script type="module" src="shell/app.js?v=ff93103405"></script>
</head>
<body>

<div id="gate" class="gate">
  <form id="gate-form" class="gate-card" novalidate>
    <svg class="gate-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <h1 class="gate-title">Secure Dashboard</h1>
    <p class="gate-hint">Enter password to access</p>
    <label class="gate-label" for="gate-password">Password</label>
    <input id="gate-password" class="gate-input" name="password" type="password" autocomplete="current-password" required>
    <p id="gate-error" class="gate-error" role="alert"></p>
    <button id="gate-submit" class="gate-button" type="submit" disabled>Unlock</button>
    <p id="gate-version" class="gate-version"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="menu-button" class="menu-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="topbar-title">LIJ PX</span>
  </header>

  <nav id="sidebar" class="sidebar" aria-label="Hub">
    <div class="sidebar-logo">
      <p class="sidebar-name"><span class="logo-icon" aria-hidden="true">PX</span> LIJ PX</p>
      <p class="sidebar-subtitle">Patient Experience Hub</p>
      <p id="site-version" class="sidebar-version"></p>
    </div>
    <div id="nav-list" class="sidebar-nav"></div>
  </nav>
  <div id="scrim" class="scrim" hidden></div>

  <main id="main" class="main">
    <div class="print-header">
      <div>
        <p id="print-tool" class="print-tool"></p>
        <h1 id="print-title" class="print-title"></h1>
      </div>
      <div class="print-meta">
        <p id="print-asof"></p>
        <p id="print-date"></p>
      </div>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>

</body>
</html>
