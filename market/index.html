<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ABV — Trading Desk Hub</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{--bg:#0b1220;--panel:#111c30;--panel2:#152238;--line:#22304a;--txt:#e6edf6;--mut:#8aa0bd;
        --blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--slate:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  body{background:var(--bg);color:var(--txt);display:flex;min-height:100vh}
  .side{width:230px;background:#0f172a;border-right:1px solid var(--line);padding:22px 0;position:fixed;height:100vh;overflow-y:auto}
  .brand{padding:0 22px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .brand h1{font-size:22px;letter-spacing:1px}.brand .sub{color:var(--mut);font-size:11px;margin-top:3px;text-transform:uppercase;letter-spacing:1.5px}
  .nav a{display:flex;align-items:center;gap:11px;padding:11px 22px;color:var(--mut);text-decoration:none;font-size:14px;font-weight:500;border-left:3px solid transparent;cursor:pointer}
  .nav a:hover{color:var(--txt);background:#13203a}.nav a.active{color:var(--txt);background:#13203a;border-left-color:var(--blue)}
  .nav .ico{width:18px;text-align:center}
  .main{margin-left:230px;flex:1;padding:24px 30px;max-width:1340px}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .top h2{font-size:23px}.updated{color:var(--mut);font-size:12px}
  .verdict{background:linear-gradient(90deg,#15233c,#111c30);border:1px solid var(--line);border-radius:12px;padding:15px 20px;margin:12px 0 18px}
  .verdict .v{font-size:18px;font-weight:700}.verdict .p{color:var(--mut);font-size:13px;margin-top:5px;line-height:1.5}
  section{display:none}section.show{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .grid{display:grid;gap:14px;margin-bottom:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600}
  .kpi .val{font-size:28px;font-weight:700;margin:2px 0}.kpi .note{color:var(--mut);font-size:12px}.kpi .lab{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  .green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.blue{color:var(--blue)}
  .bg-green{background:var(--green)}.bg-amber{background:var(--amber)}.bg-red{background:var(--red)}
  .strip{display:flex;gap:10px;flex-wrap:wrap}
  .tile{flex:1;min-width:118px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 13px}
  .tile .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .tile .v{font-size:19px;font-weight:700;margin-top:3px}.tile .c{font-size:11px;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid #18253c}tr:hover td{background:#13203a}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .b1{background:rgba(16,185,129,.15);color:var(--green)}.bwait{background:rgba(245,158,11,.15);color:var(--amber)}.bout{background:rgba(239,68,68,.15);color:var(--red)}
  .chart{height:300px}.tall{height:330px}
  .ladder{display:flex;flex-direction:column;gap:9px}
  .rung{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:8px}
  .rung.armed{border-left-color:var(--green)}.rung .t{font-weight:600;font-size:13px}.rung .d{color:var(--mut);font-size:12px}
  .log-item{padding:13px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin-bottom:9px}
  .log-item .d{color:var(--blue);font-size:12px;font-weight:600;margin-bottom:4px}.log-item .n{font-size:13px;line-height:1.5}
  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px 30px;width:320px;text-align:center}
  .gate h1{font-size:24px;letter-spacing:1px;margin-bottom:4px}.gate .s{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:22px}
  .gate input{width:100%;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:15px;text-align:center;margin-bottom:12px}
  .gate input:focus{outline:none;border-color:var(--blue)}
  .gate button{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  .gate .msg{color:var(--red);font-size:12px;height:16px;margin-top:10px}
</style></head>
<body>
<div class="gate" id="gate"><div class="box">
  <h1>ABV</h1><div class="s">Trading Desk Hub</div>
  <input type="password" id="pw" placeholder="Password" autofocus>
  <button id="go">Unlock</button><div class="msg" id="msg"></div>
</div></div>
<div class="side">
  <div class="brand"><h1>ABV</h1><div class="sub">Trading Desk Hub</div></div>
  <nav class="nav" id="nav">
    <a data-s="regime" class="active"><span class="ico">🌡️</span> Regime</a>
    <a data-s="trends"><span class="ico">📉</span> Macro Trends</a>
    <a data-s="deploy"><span class="ico">💰</span> Deployment</a>
    <a data-s="dips"><span class="ico">📈</span> Dip Signature</a>
    <a data-s="watch"><span class="ico">🎯</span> Watchlist</a>
    <a data-s="port"><span class="ico">📊</span> Portfolio</a>
    <a data-s="edges"><span class="ico">🛰️</span> Edges</a>
    <a data-s="log"><span class="ico">📓</span> Weekly Log</a>
  </nav>
</div>
<div class="main">
  <div class="top"><h2 id="title">Market Regime</h2><div class="updated">Updated <span id="upd">—</span></div></div>
  <div class="verdict" id="verdict"></div>
  <div id="content"></div>
</div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const stColor={green:'var(--green)',amber:'var(--amber)',red:'var(--red)'};
const AX={axisLabel:{color:'#8aa0bd'},splitLine:{lineStyle:{color:'#18253c'}}};
let D={};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const _p=s=>s.split('-').map(Number);
const fmtMY=s=>{const[y,m]=_p(s);return MON[m-1]+" '"+String(y).padStart(2,'0');};
const fmtFull=s=>{const[y,m,d]=_p(s);return MON[m-1]+' '+d+", '"+String(y).padStart(2,'0');};
const fmtFY=s=>{const[y,m,d]=_p(s);const yr=y>2000?y:2000+y;return MON[m-1]+' '+d+', '+yr;};
const C=id=>echarts.init($('#'+id));
function kpiCard(k){return '<div class="card kpi"><div class="lab">'+k.label+'</div><div class="val" style="color:'+(stColor[k.state]||'var(--txt)')+'">'+k.value+'</div><div class="note"><span class="dot bg-'+k.state+'"></span>'+k.note+'</div></div>';}
function mtile(m){const c=m.c==null?'':'<div class="c '+(m.c>=0?'green':'red')+'">'+(m.c>=0?'▲':'▼')+' '+Math.abs(m.c)+'%</div>';return '<div class="tile"><div class="k">'+m.k+'</div><div class="v">'+m.v+'</div>'+c+'</div>';}
function stile(t){return '<div class="tile"><div class="k">'+t.k+'</div><div class="v" style="color:'+(stColor[t.state]||'var(--txt)')+'">'+t.v+'</div><div class="c" style="color:var(--mut)">'+t.note+'</div></div>';}
function gauge(id,val,max,zones,fmt){C(id).setOption({series:[{type:'gauge',startAngle:210,endAngle:-30,min:0,max:max,
  progress:{show:true,width:11,roundCap:true,itemStyle:{color:'#f59e0b'}},axisLine:{lineStyle:{width:11,color:zones}},
  pointer:{width:5,length:'60%',itemStyle:{color:'#e6edf6'}},axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},
  anchor:{show:true,size:12,itemStyle:{color:'#e6edf6'}},detail:{valueAnimation:true,fontSize:13,fontWeight:700,color:'#e6edf6',offsetCenter:[0,'80%'],formatter:fmt},
  data:[{value:val}],title:{show:false}}]});}

function trendChart(id,t){const last=t.x.length-1,step=Math.max(1,Math.ceil(t.x.length/6));
  const series=t.series.map(s=>({name:s.name,type:'line',smooth:true,symbol:'none',data:s.data,lineStyle:{color:s.color,width:2},itemStyle:{color:s.color},
    areaStyle:t.series.length===1?{color:'rgba(59,130,246,.12)'}:undefined,
    endLabel:{show:true,color:s.color,fontWeight:700,fontSize:11,formatter:p=>p.value+(t.unit==='%'?'%':'')}}));
  if(t.ref!=null&&series[0])series[0].markLine={silent:true,symbol:'none',lineStyle:{color:'#10b981',type:'dashed'},data:[{yAxis:t.ref}],label:{formatter:'Fed '+t.ref+'% target',color:'#10b981',position:'insideStartTop'}};
  C(id).setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:'#8aa0bd'},top:0,left:0},grid:{left:48,right:54,top:t.series.length>1?28:14,bottom:24},
    xAxis:{type:'category',data:t.x,boundaryGap:false,axisLabel:{color:'#8aa0bd',interval:function(i){return i===last||i%step===0;}}},
    yAxis:Object.assign({type:'value',scale:true,axisLabel:{color:'#8aa0bd',formatter:'{value}'+(t.unit==='%'?'%':'')}},{splitLine:{lineStyle:{color:'#18253c'}}}),series});}

const views={
  trends(){
    const t=D.trends||{};
    setTimeout(()=>{['inflation','rates','spread','vix','unemp'].forEach((k,i)=>{if(t[k])trendChart('tr'+i,t[k]);});},20);
    return '<div class="grid g2"><div class="card"><h3>Inflation — CPI & Core PCE (YoY) vs. Fed 2% target</h3><div id="tr0" class="tall"></div></div>'+
      '<div class="card"><h3>Rates — Fed Funds, 10Y, 2Y Treasury</h3><div id="tr1" class="tall"></div></div></div>'+
      '<div class="grid g2"><div class="card"><h3>Credit Spreads (HY OAS, bps) — the stress gauge pros watch</h3><div id="tr2" class="tall"></div></div>'+
      '<div class="card"><h3>VIX — fear over time</h3><div id="tr3" class="tall"></div></div></div>'+
      '<div class="card"><h3>Unemployment Rate</h3><div id="tr4" style="height:280px"></div></div>';
  },
  regime(){
    setTimeout(()=>{
      gauge('gauge',D.regime.gauge,100,[[0.33,'#10b981'],[0.66,'#f59e0b'],[1,'#ef4444']],v=>v<33?'RISK-ON':v<66?'CAUTIOUS':'DEFENSIVE');
      gauge('vixg',18.9,50,[[0.3,'#10b981'],[0.5,'#f59e0b'],[1,'#ef4444']],v=>'VIX '+v);
      gauge('bearg',70,100,[[0.5,'#10b981'],[0.8,'#f59e0b'],[1,'#ef4444']],v=>v+'%');
      const h=D.spy_history||[],full=h.map(x=>fmtFull(x.d));
      C('spyc').setOption({tooltip:{trigger:'axis',formatter:p=>full[p[0].dataIndex]+'<br/>SPY $'+p[0].data+'<br/>50-day $'+p[1].data+'<br/>200-day $'+p[2].data},
        legend:{textStyle:{color:'#8aa0bd'},data:['SPY','50-day','200-day'],top:0,left:0},grid:{left:48,right:56,top:28,bottom:22},
        xAxis:{type:'category',data:h.map(x=>fmtMY(x.d)),boundaryGap:false,axisLabel:{color:'#8aa0bd',interval:function(i){return i===h.length-1||i%Math.max(1,Math.ceil(h.length/6))===0;}}},yAxis:Object.assign({type:'value',scale:true},AX),
        series:[{name:'SPY',type:'line',smooth:true,symbol:'none',data:h.map(x=>x.c),endLabel:{show:true,color:'#3b82f6',fontWeight:700,fontSize:11,formatter:p=>'$'+p.value},lineStyle:{color:'#3b82f6',width:2.5},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(59,130,246,.35)'},{offset:1,color:'rgba(59,130,246,0)'}])}},
          {name:'50-day',type:'line',smooth:true,symbol:'none',data:h.map(x=>x.m5),lineStyle:{color:'#10b981',width:1.3}},
          {name:'200-day',type:'line',smooth:true,symbol:'none',data:h.map(x=>x.m),lineStyle:{color:'#f59e0b',width:1.3,type:'dashed'}}]});
      const cv=D.curve||[];
      C('curvec').setOption({tooltip:{trigger:'axis',formatter:p=>p[0].name+' Treasury: '+p[0].data+'%'},grid:{left:42,right:18,top:18,bottom:26},
        xAxis:{type:'category',data:cv.map(x=>x.t),axisLabel:{color:'#8aa0bd'}},yAxis:Object.assign({type:'value',scale:true,axisLabel:{color:'#8aa0bd',formatter:'{value}%'}},{splitLine:{lineStyle:{color:'#18253c'}}}),
        series:[{type:'line',smooth:true,data:cv.map(x=>x.y),symbolSize:9,lineStyle:{color:'#3b82f6',width:2.5},itemStyle:{color:'#3b82f6'},
          areaStyle:{color:'rgba(59,130,246,.15)'},label:{show:true,formatter:'{c}%',color:'#e6edf6',position:'top'}}]});
      const sec=(D.sectors||[]).slice().reverse();
      C('secc').setOption({tooltip:{trigger:'axis'},grid:{left:90,right:30,top:8,bottom:24},
        xAxis:Object.assign({type:'value',axisLabel:{color:'#8aa0bd',formatter:'{value}%'}},{splitLine:{lineStyle:{color:'#18253c'}}}),
        yAxis:{type:'category',data:sec.map(x=>x.s),axisLabel:{color:'#e6edf6'}},
        series:[{type:'bar',data:sec.map(x=>({value:x.v,itemStyle:{color:x.v>=0?'#10b981':'#ef4444',borderRadius:[0,3,3,0]}}))}]});
    },20);
    return '<div class="card" style="margin-bottom:14px"><h3>Markets — Jun 8 close</h3><div class="strip">'+(D.markets||[]).map(mtile).join('')+'</div></div>'+
      '<div class="grid g3"><div class="card"><h3>Regime Risk Dial</h3><div id="gauge" style="height:185px"></div></div>'+
      '<div class="card"><h3>Volatility (VIX)</h3><div id="vixg" style="height:185px"></div></div>'+
      '<div class="card"><h3>Bear-Market Risk</h3><div id="bearg" style="height:185px"></div></div></div>'+
      '<div class="grid g2"><div class="card"><h3>S&P 500 vs 50 & 200-day (2yr)</h3><div id="spyc" style="height:240px"></div></div>'+
      '<div class="card"><h3>US Treasury Yield Curve</h3><div id="curvec" style="height:240px"></div></div></div>'+
      '<div class="grid g3">'+D.regime.kpis.map(kpiCard).join('')+'</div>'+
      '<div class="card" style="margin-bottom:14px"><h3>Rates & Credit (FRED)</h3><div class="strip">'+(D.rates||[]).map(stile).join('')+'</div></div>'+
      '<div class="card" style="margin-bottom:14px"><h3>The Economy (BLS / BEA / Census via FRED)</h3><div class="strip">'+(D.economy||[]).map(stile).join('')+'</div></div>'+
      '<div class="card"><h3>Sector performance — Jun 8 close</h3><div id="secc" style="height:260px"></div></div>';
  },
  deploy(){
    setTimeout(()=>{C('buckets').setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:['52%','78%'],itemStyle:{borderColor:'#0b1220',borderWidth:3},label:{color:'#e6edf6',fontSize:12},
      data:D.deployment.buckets.map(b=>({value:b.pct,name:b.name,itemStyle:{color:b.color}}))}]});},20);
    return '<div class="grid g2"><div class="card"><h3>$100k Allocation</h3><div id="buckets" class="chart"></div></div>'+
      '<div class="card"><h3>Crash Ladder — deploy the reserve on the dip</h3><div class="ladder">'+
      D.deployment.ladder.map(r=>'<div class="rung '+(r.armed?'armed':'')+'"><div><div class="t">'+r.trigger+'</div><div class="d">deploy '+r.deploy+'</div></div><div class="'+(r.armed?'green':'amber')+'">'+(r.armed?'ARMED':'waiting')+'</div></div>').join('')+
      '<div class="d" style="color:var(--mut);font-size:12px;margin-top:6px">SPY is '+D.deployment.spy_drawdown+'% off its high — no rung armed.</div></div></div></div>';
  },
  dips(){
    setTimeout(()=>{const r=D.dip_signature.rows;
      C('dipc').setOption({tooltip:{trigger:'axis'},legend:{textStyle:{color:'#8aa0bd'},data:['Depth %','+60d %']},grid:{left:46,right:18,top:38,bottom:46},
        xAxis:{type:'category',data:r.map(x=>x.date),axisLabel:{color:'#8aa0bd',rotate:20,fontSize:10}},yAxis:Object.assign({type:'value'},AX),
        series:[{name:'Depth %',type:'bar',data:r.map(x=>x.depth),itemStyle:{color:'#ef4444',borderRadius:[0,0,4,4]}},{name:'+60d %',type:'bar',data:r.map(x=>x.fwd60),itemStyle:{color:'#10b981',borderRadius:[4,4,0,0]}}]});
      const pts=r.filter(x=>x.fwd60!=null).map(x=>[x.depth,x.fwd60,x.date]);
      C('dipsc').setOption({tooltip:{formatter:p=>p.data[2]+'<br/>depth '+p.data[0]+'%<br/>+60d '+p.data[1]+'%'},grid:{left:46,right:20,top:18,bottom:38},
        xAxis:Object.assign({name:'Depth %',nameLocation:'middle',nameGap:24,nameTextStyle:{color:'#8aa0bd'},type:'value'},AX),yAxis:Object.assign({name:'+60d %',nameTextStyle:{color:'#8aa0bd'},type:'value'},AX),
        series:[{type:'scatter',symbolSize:15,data:pts,itemStyle:{color:'#3b82f6'}}]});
    },20);
    return '<div class="grid g2"><div class="card"><h3>Dip depth vs. the bounce that followed</h3><div id="dipc" class="tall"></div></div>'+
      '<div class="card"><h3>Correlation: deeper dip → bigger 60-day bounce</h3><div id="dipsc" class="tall"></div></div></div>'+
      '<div class="card"><h3>The signature (COVID + 2018 from the record)</h3><table><tr><th>Trough</th><th>SPY</th><th>Depth</th><th>RSI</th><th>vs 200DMA</th><th>+60d</th><th>+120d</th></tr>'+
      D.dip_signature.rows.map(x=>'<tr><td>'+x.date+'</td><td>$'+x.price+'</td><td class="red">'+x.depth+'%</td><td>'+(x.rsi??'—')+'</td><td>'+(x.vs200==null?'—':x.vs200+'%')+'</td><td class="green">'+(x.fwd60==null?'—':'+'+x.fwd60+'%')+'</td><td class="green">'+(x.fwd120==null?'—':'+'+x.fwd120+'%')+'</td></tr>').join('')+
      '</table><p style="color:var(--mut);font-size:13px;margin-top:10px">'+D.dip_signature.note+'</p></div>';
  },
  watch(){
    const bc={'1':'b1','wait':'bwait','out':'bout'},bl={'1':'Tier 1','wait':'Wait','out':'Knife'},tc={'1':'#10b981','wait':'#f59e0b','out':'#ef4444'};
    setTimeout(()=>{const w=D.watchlist.filter(x=>x.rsi!=null);
      C('watchc').setOption({tooltip:{formatter:p=>p.data[3]+'<br/>RSI '+p.data[0]+' · off-high '+p.data[1]+'% · ATR '+p.data[2]+'%'},grid:{left:50,right:24,top:18,bottom:40},
        xAxis:Object.assign({name:'RSI',nameLocation:'middle',nameGap:24,nameTextStyle:{color:'#8aa0bd'},type:'value',min:30,max:80},AX),yAxis:Object.assign({name:'% off high',nameLocation:'middle',nameGap:38,nameRotate:90,nameTextStyle:{color:'#8aa0bd'},type:'value'},AX),
        series:[{type:'scatter',symbolSize:d=>Math.max(13,(d[2]||4)*4),data:w.map(x=>[x.rsi,x.offhi,x.atr,x.ticker,x.tier]),itemStyle:{color:p=>tc[p.data[4]]},label:{show:true,formatter:p=>p.data[3],position:'top',color:'#e6edf6',fontSize:11}}]});
    },20);
    return '<div class="card"><h3>Setup map — RSI vs. pullback depth (bubble size = volatility)</h3><div id="watchc" class="tall"></div></div>'+
      '<div class="card" style="margin-top:14px"><h3>Watchlist — knife filter + AI gate applied</h3><table><tr><th>Ticker</th><th>RSI</th><th>Off high</th><th>ATR%</th><th>Analyst / source</th><th>Status</th><th>Note</th></tr>'+
      D.watchlist.map(w=>'<tr><td><b>'+w.ticker+'</b></td><td>'+(w.rsi??'—')+'</td><td>'+w.offhi+'%</td><td>'+(w.atr??'—')+'</td><td>'+w.analyst+'</td><td><span class="badge '+bc[w.tier]+'">'+bl[w.tier]+'</span></td><td style="color:var(--mut)">'+w.note+'</td></tr>').join('')+'</table></div>';
  },
  port(){
    setTimeout(()=>{const p=D.portfolio.slice().sort((a,b)=>a.pnl-b.pnl);
      C('pnl').setOption({tooltip:{trigger:'axis'},grid:{left:60,right:34,top:10,bottom:28},xAxis:Object.assign({type:'value',axisLabel:{color:'#8aa0bd',formatter:'{value}%'}},{splitLine:{lineStyle:{color:'#18253c'}}}),
        yAxis:{type:'category',data:p.map(x=>x.ticker),axisLabel:{color:'#e6edf6'}},series:[{type:'bar',data:p.map(x=>({value:x.pnl,itemStyle:{color:x.pnl>=0?'#10b981':'#ef4444',borderRadius:[0,3,3,0]}}))}]});
      const win=D.portfolio.filter(x=>x.pnl>=0).length;
      C('wl').setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:['55%','80%'],itemStyle:{borderColor:'#0b1220',borderWidth:3},label:{color:'#e6edf6'},
        data:[{value:win,name:'Winners',itemStyle:{color:'#10b981'}},{value:D.portfolio.length-win,name:'Losers',itemStyle:{color:'#ef4444'}}]}]});
    },20);
    return '<div class="grid g2"><div class="card"><h3>Holdings P&L %</h3><div id="pnl" class="tall"></div></div>'+
      '<div class="card"><h3>Win / Loss split</h3><div id="wl" style="height:200px"></div><table style="margin-top:8px"><tr><th>Ticker</th><th>P&L</th><th>Action</th></tr>'+
      D.portfolio.map(x=>'<tr><td><b>'+x.ticker+'</b></td><td class="'+(x.pnl>=0?'green':'red')+'">'+(x.pnl>0?'+':'')+x.pnl+'%</td><td style="color:var(--mut)">'+x.tag+'</td></tr>').join('')+'</table></div></div>';
  },
  edges(){return '<div class="card"><h3>Convergence (insider buying + improving analyst trend)</h3>'+
    (D.edges.convergence.length?D.edges.convergence.map(c=>'<div class="rung"><div class="t">'+c+'</div></div>').join(''):'<p style="color:var(--mut);font-size:13px">None today. Nightly engine populates this once probed.</p>')+
    '<p style="color:var(--mut);font-size:13px;margin-top:14px"><b>Watching (weekend web scan):</b> '+D.edges.watching+'</p><p style="color:var(--mut);font-size:12px;margin-top:6px">'+D.edges.note+'</p></div>';},
  log(){return '<div class="card"><h3>Weekly Log — every read & did-it-work</h3>'+D.weekly_log.map(l=>'<div class="log-item"><div class="d">'+fmtFY(l.date)+'</div><div class="n">'+l.note+'</div></div>').join('')+'</div>';}
};
const titles={regime:'Market Regime',trends:'Macro Trends',deploy:'$100k Deployment',dips:'Dip Signature',watch:'Watchlist',port:'Portfolio',edges:'Edges',log:'Weekly Log'};
function show(s){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.s===s));$('#title').textContent=titles[s];$('#verdict').style.display=s==='regime'?'block':'none';
  document.querySelectorAll('section').forEach(x=>x.remove());const sec=document.createElement('section');sec.className='show';sec.innerHTML=views[s]();$('#content').appendChild(sec);}
$('#nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a)show(a.dataset.s);});
function render(d){D=d;$('#upd').textContent=d.updated;$('#verdict').innerHTML='<div class="v">'+d.regime.verdict+'</div><div class="p">'+d.regime.posture+'</div>';$('#gate').style.display='none';show('regime');}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){const pw=$('#pw').value;if(!pw)return;$('#msg').textContent='';
  try{const e=await(await fetch('./enc.json',{cache:'no-store'})).json();
    const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:100000,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));render(JSON.parse(new TextDecoder().decode(pt)));
  }catch(err){$('#msg').textContent='Wrong password';$('#pw').value='';}}
$('#go').addEventListener('click',unlock);$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
