<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Nomination Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#17375e;--blue:#003CA5;--bright:#009ADF;--gold:#C9962B;--bg:#f0f2f5;--card:#fff;--line:#e5e7eb;--line2:#f1f3f6;
--text:#1a1a2e;--muted:#5f6b7a;--dim:#66717f;--green:#1f7a4d;--red:#b42318;--amber:#8a5a00;--font:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
--serif:'IBM Plex Serif',Georgia,serif;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:15px/1.5 var(--font);color:var(--text);background:var(--bg)}
button{font:inherit}[hidden]{display:none!important}
/* gate + name */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:30px 30px 26px}
.box h1{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--navy);margin:0 0 18px}
.box label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.box input,.box select{width:100%;border:1px solid #cfd5de;border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;color:var(--text)}
.box input:focus,.box select:focus,.search:focus,.sel:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.go{width:100%;margin-top:14px;padding:11px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.go:disabled{opacity:.55;cursor:default}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:20px}
.box .note{font-size:13px;color:var(--muted);margin:-8px 0 16px}
.box img{height:30px;margin-bottom:18px}
/* app */
#app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#cdd6e3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .ey{white-space:nowrap;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.75)}
.brand .t{font-size:19px;font-weight:600;color:#fff;margin-top:4px;line-height:1.25}
.prog{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.08)}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ring i{width:36px;height:36px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:#fff}
.prog b{display:block;color:#fff;font-weight:600;font-size:14px}.prog span{font-size:12px;white-space:nowrap}
.list{padding:10px 0 28px;overflow:auto;flex:1;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}.list::-webkit-scrollbar{display:none}
.list .h{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.7);padding:8px 22px}
.aw{display:flex;align-items:center;gap:10px;padding:8px 22px;font-size:14px;color:#e3e9f1;cursor:pointer;border:0;border-left:3px solid transparent;background:none;width:100%;text-align:left}
.aw:hover{background:rgba(255,255,255,.04)}
.aw.on{background:rgba(255,255,255,.08);border-left-color:var(--bright);color:#fff;font-weight:500}
.aw .st{margin-left:auto;font-size:12px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums}
.ok{width:16px;height:16px;border-radius:50%;background:var(--bright);display:grid;place-items:center;flex-shrink:0}
.ok svg{width:10px;height:10px}.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #4a5f7f;flex-shrink:0}
.dot.half{border-color:var(--bright);background:linear-gradient(90deg,var(--bright) 50%,transparent 50%)}
.foot{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.78)}
.foot b{color:#fff;font-weight:500}.foot a{color:#fff;text-decoration:underline;cursor:pointer}.foot a:hover{color:#fff}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 32px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5}
.top img{height:26px}.top .sp{flex:1}.top .who{font-size:13.5px;color:var(--muted)}.top .who b{color:var(--text);font-weight:600}
.saved{font-size:12.5px;color:var(--green);display:flex;align-items:center;gap:6px}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.saved.busy{color:var(--muted)}.saved.bad{color:var(--red)}
.banner{margin:18px 32px 0;padding:12px 16px;border-radius:10px;font-size:14px;display:flex;gap:14px;align-items:center}
.banner.done{background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);color:var(--text);box-shadow:var(--shadow)}.banner.done b{color:var(--green)}.banner.late{background:#fff6e5;border:1px solid #f0d49a;color:#6b4500}
.banner button{margin-left:auto;border:1px solid currentColor;background:#fff;color:inherit;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13.5px}
.rk.none{visibility:hidden}
.body{display:grid;grid-template-columns:minmax(0,980px) clamp(270px,21vw,360px);gap:28px;padding:26px 32px 60px}
.hero .ey{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:#4f5b6a}
.hero h1{font-family:var(--serif);font-weight:500;font-size:30px;color:var(--navy);margin:4px 0 6px;line-height:1.2}
.hero p{margin:0;color:var(--muted);max-width:760px}
.how{margin:16px 0 18px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 26px}
.how b{color:var(--text);font-weight:600}.how>span{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.how em{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;display:inline-grid;place-items:center;flex-shrink:0}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex:1 1 300px;white-space:nowrap}.tools .search,.tools .sel{flex:0 0 auto}
.tabs button{padding:9px 14px;font-size:14px;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tabs small{color:var(--dim);margin-left:4px;font-size:12.5px}
.search{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;width:170px;background:#fff}
.sel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;background:#fff;color:var(--text)}
.grp{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.grp h2{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--navy);margin:0;font-weight:600}
.grp span{font-size:13px;color:var(--dim)}
.grp.sec{margin-top:56px;padding-top:22px;border-top:1px solid var(--line)}
.restbtn{display:block;width:100%;padding:14px;border:1px dashed #b9c2cf;border-radius:10px;background:#fff;color:var(--navy);font-weight:600;font-size:14.5px;cursor:pointer}.restbtn:hover{border-color:var(--navy)}
.cmt{width:100%;margin-top:10px;padding:10px;border:1.5px solid var(--bright);border-radius:8px;background:#eaf6fd;color:#00609a;font-weight:600;font-size:14px;cursor:pointer}.cmt:hover{background:#d8effb}
.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cfd5de;border-radius:12px;margin-top:14px}
.nom{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.nom.win{border-color:#9db3d9;background:#f7f9fd}
.nom.bk{border-color:#b7c0cc;background:#fafbfc}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:18px 20px 14px}
.rk{width:36px;height:36px;border-radius:50%;background:var(--line2);color:var(--muted);display:grid;place-items:center;font-weight:600;font-size:14px}
.nom.win .rk{background:var(--blue);color:#fff}.nom.bk .rk{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
.nm{font-size:17px;font-weight:600;color:var(--text)}.role{font-size:13.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;font-size:13px;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.bars{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:5px}.bars i{width:6px;height:12px;border-radius:1px;background:#c3cad4}.bars i.f{background:var(--bright)}
.q{text-wrap:pretty;font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.55;color:#2a3342;margin:12px 0 4px}
.q::before{content:"\201C";color:var(--gold);font-size:26px;line-height:0;vertical-align:-8px;margin-right:2px;font-style:normal}
.qby{font-size:12.5px;color:var(--muted)}
.why{font-size:13px;color:var(--muted);margin-top:8px}
.sum{text-wrap:pretty;font-size:14.5px;color:var(--text);margin-top:8px;max-width:680px}
.method{font-size:13px;color:var(--muted);margin:12px 0 4px;max-width:760px}.method summary{cursor:pointer;color:var(--blue);font-weight:600;display:inline}.method p{margin:6px 0 0}.method b{color:var(--text);font-weight:600}
.pre{font-size:13px;color:var(--muted)}.elsew{color:var(--amber)}
.acts{display:flex;flex-direction:column;gap:8px;min-width:132px}
.b{border:1px solid #cfd5de;background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.b:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.b:disabled{opacity:.5;cursor:default}
.b.w.on{background:var(--blue);border-color:var(--blue);color:#fff}
.b.k.on{background:#e7edf7;border-color:var(--navy);color:var(--navy)}
.b.m{font-weight:500;color:var(--muted)}.b.m.on{background:#fff8e6;border-color:var(--gold);color:#7a5a12}
.ex{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line2);padding:10px 20px;font-size:13.5px;background:#fbfcfd}
.ex button{color:var(--blue);font-weight:600;cursor:pointer;border:0;background:none;padding:0;white-space:nowrap;font-size:13.5px}
.ex span{color:var(--muted)}.ex .also{color:var(--amber)}
.all{border-top:1px solid var(--line2);padding:6px 20px 14px;background:#fbfcfd}
.c{padding:10px 0;border-bottom:1px solid var(--line2)}.c:last-child{border-bottom:0}
.c .by{font-size:12.5px;color:var(--muted);margin-bottom:2px}.c .by b{color:var(--text);font-weight:600}
.c p{margin:0;font-size:14.5px;white-space:pre-line}.c p.none{color:var(--dim);font-style:italic}
.tag{font-size:11.5px;font-weight:600;color:var(--gold);letter-spacing:.4px;text-transform:uppercase;margin-left:8px}
.tag.self{color:var(--muted)}
.picks{position:sticky;top:78px;align-self:start}
.pk{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px}
.pk h3{margin:0;font-size:15px;color:var(--navy)}.pk .s{font-size:13px;color:var(--muted);margin:2px 0 14px}
.meter{height:6px;background:var(--line2);border-radius:3px;margin-bottom:14px}.meter i{display:block;height:6px;background:var(--blue);border-radius:3px;transition:width .2s}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;min-height:39px}
.slot .n{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;flex-shrink:0}
.sdq{color:#c8102e;font-weight:700;font-size:13.5px}
.tprog{display:flex;align-items:center;gap:10px;margin-right:22px}
.tbar{width:220px;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.tbar i{display:block;height:100%;width:0;background:var(--blue);border-radius:4px;transition:width .35s ease}
#tbarTxt{font-size:13px;color:var(--dim);white-space:nowrap}#tbarTxt b{color:var(--navy)}
@media (max-width:1400px){.tbar{width:120px}#tbarTxt .x{display:none}.tprog{margin-right:14px}}
.confetti{position:fixed;top:-12px;width:8px;height:12px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.thanks{text-align:center;padding:34px 34px 8px}.thanks h2{margin:0 0 10px}.thanks p{margin:0 auto 8px;max-width:420px;line-height:1.5}
.slot .nmw{min-width:0;line-height:1.25}.slot .u{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.tbar{display:none}}
.slot .r{margin-left:auto;color:var(--dim);font-size:18px;line-height:1;cursor:pointer;border:0;background:none;padding:0 2px}
.slot .r:hover{color:var(--red)}
.slot.e{color:var(--dim)}.slot.e .n{background:#fff;border:1.5px dashed #c3cad4;color:var(--dim)}
.slot .n.bn{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
.zone{border-radius:8px;transition:background .12s,box-shadow .12s}
.zone.over{background:#eef3fb;box-shadow:0 0 0 2px var(--blue) inset}
.slot[draggable=true]{cursor:grab}.slot.over{box-shadow:0 -2px 0 var(--blue)}
.nom[draggable=true] .row{cursor:grab}.dragging{opacity:.45}
#main.rmzone{outline:2px dashed var(--red);outline-offset:6px;border-radius:12px}
.hint{font-size:12px;color:var(--muted);margin:-8px 0 12px}
.lab{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.next{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;margin-top:16px;padding:11px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer}
.next.submit{background:var(--blue)}
.sub{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(10,34,64,.25);z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,34,64,.72);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:30;padding:30px}
.mbox{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:calc(100vh - 60px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mhead{padding:22px 26px 12px}.mhead h2{font-family:var(--serif);font-weight:500;color:var(--navy);margin:0 0 4px;font-size:24px}
.mhead p{margin:0;color:var(--muted);font-size:14px}
.mlist{overflow:auto;padding:4px 26px 22px;columns:2;column-gap:28px;column-fill:balance;scrollbar-width:thin;scrollbar-color:#cfd5de transparent}
.mlist::-webkit-scrollbar{width:6px}.mlist::-webkit-scrollbar-thumb{background:#cfd5de;border-radius:3px}
.mlist div{break-inside:avoid;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.mlist h4{margin:0 0 4px;font-size:13px;color:var(--navy);letter-spacing:.3px}
.mlist .bk{color:var(--muted)}
.mlist .un{color:var(--muted);font-size:12.5px}.ubox{padding:12px 26px 4px;border-top:1px solid var(--line)}.ubox h4{margin:0 0 8px;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--navy)}.ugrid{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px}.ugrid b{color:var(--navy);margin-right:3px}.ugrid .zero{color:#b42318}.ugrid .zero b{color:#b42318}.wel{max-width:640px}.wlead{margin:4px 0 6px;font-size:15px;line-height:1.5}.wq{margin:16px 0 0;color:var(--muted)}.wbody ol{padding-left:20px}.wbody ol li{margin:4px 0}.wbody{overflow:auto;padding:0 26px 18px;font-size:14.5px;scrollbar-width:thin;scrollbar-color:#cfd5de transparent}
.wbody h4{margin:16px 0 6px;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy)}.wbody p{margin:6px 0}.wbody ol,.wbody ul{margin:6px 0;padding-left:22px}.wbody li{margin:3px 0}
.mfoot{padding:14px 26px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}
.mfoot button{padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14.5px}
.mfoot .cancel{background:#fff;border:1px solid #cfd5de;color:var(--text)}.mfoot .danger{background:var(--red);border:0;color:#fff}.mfoot .danger:disabled{opacity:.4;cursor:default}
.nom.out,.nom.selfout{background:#f6f7f9}.nom.out .row,.nom.selfout .row{opacity:.55}.dqt{color:var(--red);font-weight:600}.exl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dqa{font-size:12.5px}.reasons label{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14.5px;cursor:pointer}
.elsetag{font-size:12.5px;font-weight:600;color:var(--amber);margin-left:10px;white-space:nowrap}
.cs{font-size:12px;color:var(--muted);margin-top:4px}.cwhy{font-size:12.5px;color:#6b4500;background:#fff8e6;border-radius:6px;padding:6px 10px;margin-top:6px}
.clr{color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px}.clr:hover{color:var(--red)}.mfoot .ok2{background:var(--blue);border:0;color:#fff}
/* admin */
#admin{max-width:1180px;margin:0 auto;padding:28px 32px 60px}
#admin h1{font-family:var(--serif);font-weight:500;color:var(--navy);font-size:28px;margin:0 0 4px}
#admin .lead{color:var(--muted);margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card h2{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--navy);margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:12px}
.card h2 .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;text-align:center}th.num{text-align:center}
tr.cut td{border-bottom:2px solid var(--blue)}
tr.close td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.st-sub{color:var(--green);font-weight:600}.st-prog{color:var(--blue);font-weight:600}.st-none{color:var(--dim)}
.small{font-size:12.5px;color:var(--muted)}
.abtn{border:1px solid #cfd5de;background:#fff;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:13.5px;color:var(--text)}
.abtn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.chk{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;font-weight:400;letter-spacing:0;text-transform:none}
.flag{color:var(--amber);font-size:12.5px}
/* narrow desktop */
@media (max-width:1240px){#app{grid-template-columns:224px minmax(0,1fr)}.body{grid-template-columns:minmax(0,1fr) 260px;gap:20px;padding:22px 24px 60px}
 .top{padding:12px 24px}.row{grid-template-columns:minmax(0,1fr)}.acts{grid-column:1;flex-direction:row;min-width:0}.acts .b{min-width:120px}
.banner{margin:16px 24px 0}.search{width:170px}.aw{padding:8px 18px;font-size:13.5px}.brand,.prog,.foot{padding-left:18px;padding-right:18px}}
#phone{display:none}
@media (max-width:759px){body>*:not(#phone){display:none!important}#phone{display:grid}}
</style></head><body>

<div id="phone" class="center"><div class="box"><h1>Please open this on a computer</h1><p style="margin:0;color:var(--muted)">This page is built for a desktop or laptop screen.</p></div></div>

<div id="gate" class="center" hidden><form class="box" id="gateForm" autocomplete="off">
 <h1>Nomination Review</h1>
 <label for="pw">Password</label>
 <input id="pw" type="password" autocomplete="current-password" required autofocus>
 <button class="go" id="gateGo" type="submit">Continue</button>
 <div class="err" id="gateErr" role="alert"></div>
</form></div>

<div id="who" class="center" hidden><form class="box" id="whoForm">
 <img id="whoLogo" alt="">
 <h1>Select your name</h1>
 <label for="whoSel">Reviewer</label>
 <select id="whoSel" required><option value="">Choose your name</option></select>
 <button class="go" id="whoGo" type="submit">Continue</button>
 <div class="err" id="whoErr" role="alert"></div>
</form></div>

<div id="app" hidden>
 <aside class="side">
  <div class="brand"><div class="ey" id="bEy"></div><div class="t" id="bT"></div></div>
  <div class="prog"><div class="ring" id="ring"><i id="ringTxt"></i></div><div><b id="progTxt"></b><span id="dueTxt"></span></div></div>
  <nav class="list"><div class="h">Awards</div><div id="awList"></div></nav>
  <div class="foot">Reviewing as <b id="meName"></b> &middot; <a id="switchMe">Switch</a><br><span style="white-space:nowrap;font-size:11.5px">Picks stay private until all submit.</span><br><a id="howBtn">How this works</a> &middot; <a id="resetAll">Clear all my picks</a></div>
 </aside>
 <div>
  <div class="top"><img id="logo" alt="Long Island Jewish Medical Center"><div class="sp"></div><div class="tprog" title="Winners picked across all awards"><div class="tbar"><i id="tbarFill"></i></div><span id="tbarTxt"></span></div><div class="saved" id="saved">All changes saved</div><div class="who">Questions? Contact <b id="contact"></b></div></div>
  <div id="bannerSlot"></div>
  <div class="body">
   <section id="main"></section>
   <aside class="picks"><div class="pk" id="pk"></div></aside>
  </div>
 </div>
</div>

<div id="admin" hidden></div>
<div class="toast" id="toast" role="status"></div>
<div id="modalSlot"></div>

<script>
const API = "https://nomination-review.abv-review.workers.dev";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" stroke="#fff" stroke-width="1.6" fill="none"/></svg>';
const STRENGTH = {5:"Exceptional",4:"Strong",3:"Good",2:"General",1:"Brief"};
const fmtTime = ms => new Date(ms).toLocaleString("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) + " ET";
const fmtClock = ms => new Date(ms).toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"});
let TOKEN = null;
try { TOKEN = sessionStorage.getItem("nr_t"); } catch {}
const S = {data:null, me:null, picks:{}, everSaved:new Set(), submitted:null, due:null, released:false, cur:0, tab:"all", sort:"sugg", q:"", open:new Set(), pending:{}, timers:{}, busy:{}, dq:new Map(), closed:new Set(), collapse:true, showRest:false, showSelf:false};
try { S.collapse = localStorage.getItem("nr_cmt_open") !== "1"; } catch {}  // comments start closed (Abe 10/22)

async function api(path, opts = {}) {
  const h = {"Content-Type":"application/json"};
  if (TOKEN) h.Authorization = "Bearer " + TOKEN;
  if (opts.admin) h["X-Admin-Key"] = opts.admin;
  const r = await fetch(API + path, {method: opts.method || "GET", headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined});
  let j = {}; try { j = await r.json(); } catch {}
  return {status: r.status, ok: r.ok, ...j};
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function show(id) { for (const x of ["gate","who","app","admin"]) $(x).hidden = x !== id; }

// ---------- sign-in ----------
$("gateForm").onsubmit = async e => {
  e.preventDefault(); $("gateErr").textContent = ""; $("gateGo").disabled = true;
  try {
    const r = await api("/api/login", {method:"POST", body:{password:$("pw").value}});
    if (r.ok) { TOKEN = r.token; try { sessionStorage.setItem("nr_t", TOKEN); } catch {} $("pw").value = ""; showWho(r.reviewers); }
    else if (r.error === "locked") $("gateErr").textContent = `Too many tries. Please wait ${r.retry_after} minutes and try again.`;
    else $("gateErr").textContent = "That password is not right. Please try again.";
  } catch { $("gateErr").textContent = "Could not connect. Check your connection and try again."; }
  $("gateGo").disabled = false;
};
function showWho(list, err) {
  const sel = $("whoSel");
  sel.innerHTML = '<option value="">Choose your name</option>' + list.map(n => `<option>${esc(n)}</option>`).join("");
  $("whoErr").textContent = err || ""; $("whoLogo").hidden = true;
  show("who"); sel.focus();
}
$("whoForm").onsubmit = async e => {
  e.preventDefault(); const name = $("whoSel").value; if (!name) { $("whoErr").textContent = "Please choose your name."; return; }
  $("whoGo").disabled = true; await enter(name); $("whoGo").disabled = false;
};
async function enter(name) {
  try {
    const r = await api("/api/me", {method:"POST", body:{reviewer:name}});
    if (r.status === 401) { signOut(); return; }
    if (!r.ok) { $("whoErr").textContent = "Something went wrong. Please try again."; return; }
    S.data = r.data; S.me = r.reviewer; S.picks = r.picks || {}; S.everSaved = new Set(Object.keys(S.picks)); S.dq = new Map((r.dq || []).map(x => [x.k, x])); S.submitted = r.submitted; S.due = Date.parse(r.due_at); S.released = r.released;
    for (const a of S.data.awards) { S.picks[a.name] ||= {w:[], b:[], m:[]}; S.picks[a.name].m ||= []; a.byKey = new Map(a.nominees.map(n => [n.k, n])); }
    try { localStorage.setItem("nr_last", name); } catch {}
    const first = S.data.awards.findIndex(a => !complete(a));
    S.cur = first < 0 ? 0 : first;
    document.title = S.data.title;
    $("bEy").textContent = S.data.brand_ey; $("bT").innerHTML = esc(S.data.brand_t) + "<br>Winner Selection";
    $("logo").src = S.data.logo; $("contact").innerHTML = S.data.contact_email ? `<a href="mailto:${esc(S.data.contact_email)}?subject=${encodeURIComponent("Awards review question")}" style="color:inherit">${esc(S.data.contact)}</a>` : esc(S.data.contact); $("meName").textContent = S.me;
    show("app"); renderAll(); window.scrollTo(0, 0);
    let seen = null; try { seen = localStorage.getItem("nr_welcome_" + name); } catch {}
    if (!seen) showWelcome();
  } catch { $("whoErr").textContent = "Could not connect. Check your connection and try again."; }
}
function signOut(msg) {
  TOKEN = null; try { sessionStorage.removeItem("nr_t"); } catch {}
  S.data = null; document.title = "Nomination Review"; show("gate");
  $("gateErr").textContent = msg || ""; $("pw").focus();
}
$("switchMe").onclick = async () => {
  await flushAll();
  const r = await api("/api/login", {method:"POST", body:{password:""}}).catch(() => ({}));
  void r; // only to keep the session warm; the reviewer list comes from the data we have
  showWho(S.data.reviewers);
};

// ---------- state helpers ----------
const A = () => S.data.awards[S.cur];
const P = (a = A()) => S.picks[a.name];
const complete = a => P(a).w.length === S.data.winners;
const doneCount = () => S.data.awards.filter(complete).length;
const locked = () => !!S.submitted;

function setPick(k, kind) {
  if (locked()) { toast("Your picks are submitted. Choose “Change my picks” to edit."); return; }
  const p = P(), a = A();
  p.m ||= [];
  if (kind === "m") { p.m = p.m.includes(k) ? p.m.filter(x => x !== k) : [...p.m, k]; queueSave(a.name); renderAll(true); return; }
  p.m = p.m.filter(x => x !== k);
  const inW = p.w.includes(k), inB = p.b.includes(k);
  if (kind === "w") {
    if (inW) p.w = p.w.filter(x => x !== k);
    else {
      if (p.w.length >= S.data.winners) { toast(`You already have ${S.data.winners} winners. Remove one first.`); return; }
      p.b = p.b.filter(x => x !== k); p.w.push(k);
    }
  } else {
    if (inB) p.b = p.b.filter(x => x !== k);
    else {
      if (p.b.length >= S.data.backups) { toast(`You already have ${S.data.backups} backups. Remove one first.`); return; }
      p.w = p.w.filter(x => x !== k); p.b.push(k);
    }
  }
  queueSave(a.name); renderAll(true);
}
function queueSave(award) {
  S.pending[award] = true; setSaved("busy");
  clearTimeout(S.timers[award]); S.timers[award] = setTimeout(() => save(award), 350);
}
async function save(award, tries = 0) {
  while (S.busy[award]) await S.busy[award];  // one save per award at a time, so an older save never lands last
  let done; S.busy[award] = new Promise(r => done = r);
  const p = S.picks[award];
  try {
    const r = await api("/api/picks", {method:"PUT", body:{award, winners:p.w, backups:p.b, maybe:(p.m || []).filter(k => !p.w.includes(k) && !p.b.includes(k))}});
    if (r.status === 401) { setSaved("bad", "Signed out. Please sign in again."); signOut("You were signed out. Sign in again; your saved picks are kept."); return; }
    if (r.status === 409) { S.submitted = S.submitted || Date.now(); renderAll(); return; }
    if (!r.ok) throw 0;
    delete S.pending[award];
    if (!Object.keys(S.pending).length) setSaved("ok", "All changes saved, " + fmtClock(r.saved_at));
  } catch {
    setSaved("bad", "Not saved yet, retrying...");
    S.timers[award] = setTimeout(() => save(award, tries + 1), Math.min(15000, 1500 * 2 ** tries));
  } finally { S.busy[award] = null; done(); }
}
async function flushAll() {
  for (const a of Object.keys(S.pending)) { clearTimeout(S.timers[a]); await save(a); }
}
function setSaved(kind, txt) {
  const el = $("saved"); el.className = "saved" + (kind === "busy" ? " busy" : kind === "bad" ? " bad" : "");
  el.textContent = txt || (kind === "busy" ? "Saving..." : "All changes saved");
}
window.addEventListener("beforeunload", e => { if (Object.keys(S.pending).length) { e.preventDefault(); e.returnValue = ""; } });

// ---------- render ----------
function renderAll(keepScroll) {
  renderSide(); renderBanner(); renderMain(); renderPicks();
  if (!keepScroll) window.scrollTo(0, 0);
}
function renderSide() {
  const n = doneCount(), t = S.data.awards.length;
  $("ring").style.background = `conic-gradient(var(--bright) 0 ${n / t * 360}deg, rgba(255,255,255,.12) ${n / t * 360}deg 360deg)`;
  $("ringTxt").textContent = `${n}/${t}`;
  $("progTxt").textContent = S.submitted ? "Submitted" : `${n} of ${t} awards done`;
  $("dueTxt").textContent = "Due " + S.data.due_label;
  // overall progress (Abe 10/22): winners picked across every award, so it moves with each pick, in any order
  const need = t * S.data.winners, got = S.data.awards.reduce((s, a) => s + Math.min(P(a).w.length, S.data.winners), 0);
  const pct = S.submitted ? 100 : Math.round(got / need * 100);
  $("tbarFill").style.width = pct + "%";
  $("tbarTxt").innerHTML = S.submitted ? "<b>Submitted</b>" : `<b>${pct}% done</b><span class="x"> · ${got} of ${need} winners picked</span>`;
  $("awList").innerHTML = S.data.awards.map((a, i) => {
    const c = P(a).w.length, icon = c === S.data.winners ? `<span class="ok">${CHECK}</span>` : `<span class="dot${c ? " half" : ""}"></span>`;
    return `<button class="aw${i === S.cur ? " on" : ""}" data-i="${i}">${icon}${esc(a.name)}<span class="st">${c}/${S.data.winners}</span></button>`;
  }).join("");
}
$("awList").onclick = e => { const b = e.target.closest(".aw"); if (b) go(+b.dataset.i); };
function go(i) { S.cur = i; S.tab = "all"; S.q = ""; S.open.clear(); renderAll(); }
function renderBanner() {
  let h = "";
  if (S.submitted) h = `<div class="banner done"><span><b>Your picks are submitted</b> (${esc(fmtTime(S.submitted))}). Thank you.</span><button id="reopen">Change my picks</button></div>`;
  else if (Date.now() > S.due) h = `<div class="banner late"><span><b>Picks were due ${esc(S.data.due_label)}.</b> You can still finish; please submit as soon as you can.</span></div>`;
  $("bannerSlot").innerHTML = h;
  if ($("reopen")) $("reopen").onclick = async () => {
    const r = await api("/api/reopen", {method:"POST"});
    if (r.ok) { S.submitted = null; renderAll(true); toast("You can change your picks now. Submit again when you are done."); }
    else toast("Could not reopen. Please try again.");
  };
}

function bars(n) { let s = ""; for (let i = 1; i <= 5; i++) s += `<i${n && i <= n ? ' class="f"' : ""}></i>`; return `<span class="bars">${s}</span>`; }
function card(n, a) {  // comments start closed (Abe 10/22); the blue "Show all comments" button in Your picks flips the default
  const p = P(a), w = p.w.includes(n.k), b = p.b.includes(n.k), mb = (p.m || []).includes(n.k), open = S.collapse ? S.open.has(n.k) : !S.closed.has(n.k);
  const written = n.noms.filter(x => x.t.trim());
  const blank = n.noms.filter(x => !x.t.trim());
  const meta = `<span><b>${n.votes}</b> nominator${n.votes === 1 ? "" : "s"}</span><span>Score <b>${n.score}</b>/20</span>`;
  const quote = n.quote && !open ? `<div class="q">${esc(n.quote)}</div>${n.quote_by ? `<div class="qby">${esc(nameOf(n.quote_by))}</div>` : ""}` : "";
  let left = n.merged.length ? `<span>Includes nominations entered as ${esc(n.merged.join(", "))}</span>` : "<span></span>";
  const cnt = written.length;
  const link = cnt ? (open ? "Hide comments &#9652;" : `Read ${cnt === 1 ? "the comment" : cnt === 2 ? "both comments" : "all " + cnt + " comments"} &#9662;`) : (blank.length ? (open ? "Hide &#9652;" : "See who nominated &#9662;") : "");
  let all = "";
  if (open) {
    all = `<div class="all">` + written.map(x => `<div class="c"><div class="by"><b>${esc(nameOf(x.by))}</b>${esc(unitOf(x.by))}${x.self ? '<span class="tag self">Self-nomination, not counted</span>' : ""}${x.as && x.as !== n.name ? `<span class="small"> &middot; entered as “${esc(x.as)}”</span>` : ""}</div><p>${esc(x.t)}</p>${x.ov ? `<div class="cs">Comment strength ${x.ov}/10</div>` : ""}${x.why ? `<div class="cwhy">* Why this scored lower: ${esc(x.why)}</div>` : ""}</div>`).join("")
      + (blank.length ? `<div class="c"><div class="by">Nominated without a comment by</div><p class="none">${blank.map(x => esc(nameOf(x.by)) + (x.self ? " (self)" : "")).join(", ")}</p></div>` : "") + `</div>`;
  }
  const out = S.dq.get(n.k) || (n.sdq ? {self: true} : null);
  const dis = locked() || out ? " disabled" : "";
  if (out && out.self) left = `<span class="sdq">* Not eligible: self-nominations do not count</span>`;
  else if (out) left = `<span class="dqt">Disqualified by direct leadership</span>${out.mine ? '<a class="clr" data-act="undq">Undo (put back)</a>' : ""}`;
  else if (!locked()) left = (left === "<span></span>" ? "" : left) + `<a class="clr dqa" data-act="dq">Disqualify (direct leadership only)</a>`;
  return `<div class="nom${out ? (out.self ? " selfout" : " out") : w ? " win" : b ? " bk" : ""}" data-k="${esc(n.k)}"${locked() || out ? "" : ' draggable="true"'}><div class="row"><div>
   <div class="nm">${esc(n.name)}${n.up ? `<span class="elsetag" title="Suggested so every unit has at least one winner">* Unit pick: suggested so every unit has a winner</span>` : ""}${n.elsewhere ? `<span class="elsetag" title="Each person is suggested for one award only">* Suggested winner for ${esc(n.elsewhere)}</span>` : ""}${n.tie && n.tie.length ? `<span class="elsetag" title="Same score, nominators and comments: the numbers cannot separate them">* Tied with ${esc(n.tie.join(", "))}: you choose</span>` : ""}</div>${n.role ? `<div class="role">${esc(n.role)}</div>` : ""}
   ${n.summary ? `<div class="sum">${esc(n.summary)}</div>` : ""}${quote}<div class="meta">${meta}</div></div>
   <div class="acts"><button class="b w${w ? " on" : ""}" data-act="w"${dis} aria-pressed="${w}">${w ? "&#10003; " : ""}Winner</button><button class="b k${b ? " on" : ""}" data-act="b"${dis} aria-pressed="${b}">${b ? "&#10003; " : ""}Backup</button><button class="b m${mb ? " on" : ""}" data-act="m"${dis || w || b ? " disabled" : ""} aria-pressed="${mb}" title="Private shortlist. Not counted.">${mb ? "&#9733;" : "&#9734;"} Maybe</button></div></div>
   <div class="ex"><span class="exl">${left}</span>${link ? `<button data-act="o">${link}</button>` : ""}</div>${all}</div>`;
}
const nameOf = by => by.split(",")[0];
const unitOf = by => by.includes(",") ? ", " + by.split(",").slice(1).join(",").trim() : "";

function sorted(list) {
  const s = S.sort, by = {
    sugg: (x, y) => (x.rank ?? 1e9) - (y.rank ?? 1e9) || y.score - x.score,
    votes: (x, y) => y.votes - x.votes || y.score - x.score,
    str: (x, y) => y.cp - x.cp || y.votes - x.votes,
    az: (x, y) => x.name.localeCompare(y.name),
  }[s];
  return [...list].sort((x, y) => (x.sdq ? 1 : 0) - (y.sdq ? 1 : 0) || by(x, y));  // self-nominators always last
}
function renderMain() {
  const a = A(), p = P(a), q = S.q.trim().toLowerCase();
  const match = n => !q || n.name.toLowerCase().includes(q) || n.merged.some(m => m.toLowerCase().includes(q)) || (n.role || "").toLowerCase().includes(q);
  const sugg = a.nominees.filter(n => n.tier !== "other");
  const mine = [...p.w, ...p.b].map(k => a.byKey.get(k)).filter(Boolean);
  let h = `<div class="hero"><div class="ey">Award ${S.cur + 1} of ${S.data.awards.length} &middot; ${a.nominees.length} nominees</div><h1>${esc(a.name)}</h1><p>${esc(a.desc)}</p></div>
  <div class="tools"><div class="tabs" role="tablist">
    <button class="${S.tab === "all" ? "on" : ""}" data-tab="all">Nominees<small>${a.nominees.length}</small></button>
    <button class="${S.tab === "mine" ? "on" : ""}" data-tab="mine">My picks<small>${mine.length}</small></button>
    ${S.released ? `<button class="${S.tab === "res" ? "on" : ""}" data-tab="res">Results</button>` : ""}</div>
   ${S.tab === "all" ? `<select class="sel" id="sortSel" aria-label="Sort">
     <option value="sugg"${S.sort === "sugg" ? " selected" : ""}>Sort: Suggested (highest score first)</option><option value="votes"${S.sort === "votes" ? " selected" : ""}>Most nominators</option>
     <option value="str"${S.sort === "str" ? " selected" : ""}>Strongest comments</option><option value="az"${S.sort === "az" ? " selected" : ""}>A to Z</option></select>` : ""}
   ${S.tab !== "res" ? `<input class="search" id="search" placeholder="Find a name" value="${esc(S.q)}" aria-label="Find a name">` : ""}</div>`;
  if (S.tab === "all" && S.sort === "sugg") {
    // one ranked list: suggested 7, next in line, then everyone else by score
    const t7 = sugg.filter(n => n.tier === "top7" && match(n)), bk = sugg.filter(n => n.tier === "backup" && match(n));
    const strong = a.nominees.filter(n => n.tier === "other" && !n.sdq && n.cp >= 6).sort((x, y) => y.cp - x.cp || y.score - x.score).filter(match);
    const rest = sorted(a.nominees.filter(n => n.tier === "other" && !n.sdq && n.cp < 6)).filter(match);
    const selfs = a.nominees.filter(n => n.sdq).filter(match);
    h += `<div class="grp"><h2>Suggested 7</h2><span>Start here: the highest scores for this award.</span></div>` + (t7.map(n => card(n, a)).join("") || `<div class="empty">No match in the suggested 7.</div>`);
    h += `<div class="grp sec"><h2>Next in line</h2><span>Strongest people not suggested for another award.</span></div>` + (bk.map(n => card(n, a)).join("") || `<div class="empty">No match here.</div>`);
    if (strong.length) h += `<div class="grp sec"><h2>Standout comments</h2><span>A strong, heartfelt comment, even with only one nominator.</span></div>` + strong.map(n => card(n, a)).join("");
    const showRest = S.showRest || q;  // a name search always shows everyone
    h += `<div class="grp sec"><h2>All remaining nominees</h2><span>${rest.length}, highest score first.</span></div>`
      + (showRest ? (rest.map(n => card(n, a)).join("") || `<div class="empty">No match here.</div>`) + (q ? "" : `<button class="restbtn" id="restBtn">Hide remaining nominees &#9652;</button>`)
                  : `<button class="restbtn" id="restBtn">Show all ${rest.length} remaining nominees &#9662;</button>`);
    const showSelf = S.showSelf || q;
    if (selfs.length) h += `<div class="grp sec"><h2>Not eligible</h2><span>Only nominated by themselves. Self-nominations do not count.</span></div>`
      + (showSelf ? selfs.map(n => card(n, a)).join("") + (q ? "" : `<button class="restbtn" id="selfBtn">Hide not eligible &#9652;</button>`)
                  : `<button class="restbtn" id="selfBtn">Show ${selfs.length} not eligible &#9662;</button>`);
  } else if (S.tab === "all") {
    const l = sorted(a.nominees).filter(match);
    h += `<div class="grp"><h2>All nominees</h2><span>${l.length} shown</span></div>` + (l.map(n => card(n, a)).join("") || `<div class="empty">No nominee matches “${esc(S.q)}”.</div>`);
  } else if (S.tab === "mine") {
    const w = p.w.map(k => a.byKey.get(k)).filter(n => n && match(n)), b = p.b.map(k => a.byKey.get(k)).filter(n => n && match(n));
    h += `<div class="grp"><h2>Winners</h2><span>${p.w.length} of ${S.data.winners}</span></div>` + (w.map(n => card(n, a)).join("") || `<div class="empty">No winners picked yet. Start with the Suggested tab.</div>`);
    h += `<div class="grp"><h2>Backups</h2><span>${p.b.length} of ${S.data.backups}, optional</span></div>` + (b.map(n => card(n, a)).join("") || `<div class="empty">No backups picked.</div>`);

// cards -> winners/backups; slots -> reorder, other list, or back onto the page to remove
function place(k, to, idx) {
  if (locked()) { toast("Your picks are submitted. Choose “Change my picks” to edit."); return; }
  const p = P(), a = A(), W = S.data.winners, B = S.data.backups;
  const w = p.w.filter(x => x !== k), b = p.b.filter(x => x !== k);

const DQ_REASONS = ["HR or disciplinary concern", "Performance concern", "Not eligible", "Other"];
function findName(k) { for (const a of S.data.awards) { const n = a.byKey.get(k); if (n) return n.name; } return k; }
function openDq(k) {
  const nm = esc(findName(k));
  $("modalSlot").innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dT"><div class="mbox wel"><div class="mhead"><h2 id="dT">Disqualify ${nm}?</h2>

   <div class="wbody"><h4>Reason</h4><div class="reasons">${DQ_REASONS.map(r => `<label><input type="radio" name="dqr" value="${esc(r)}"> ${esc(r)}</label>`).join("")}</div>
    <h4>Note for the organizer (optional)</h4><textarea id="dqNote" rows="3" maxlength="1000" style="width:100%;border:1px solid #cfd5de;border-radius:8px;padding:9px 12px;font:inherit"></textarea></div>
   <div class="mfoot"><button class="cancel" id="dqNo">Cancel</button><button class="danger" id="dqYes" disabled>Disqualify</button></div></div></div>`;
  $("dqNo").onclick = () => $("modalSlot").innerHTML = "";
  document.querySelectorAll("input[name=dqr]").forEach(x => x.onchange = () => $("dqYes").disabled = false);
  $("dqYes").onclick = async () => {
    $("dqYes").disabled = true; await flushAll();

    const r = await api("/api/dq", {method:"POST", body:{k, reason, note:$("dqNote").value}});

}
async function undoDq(k) {

    const body = rows.map((n, i) => `<tr class="${i === 6 ? "cut" : ""}${closeCall && n.wc === c7 ? " close" : ""}"><td class="num">${i + 1}</td><td><b>${esc(n.name)}</b><div class="small">${esc(n.role)}</div></td><td class="num"><b>${n.wc}</b></td><td class="small">${esc(n.w.join(", "))}</td><td class="num">${n.bc}</td><td class="small">${esc(n.b.join(", "))}</td><td class="num">${n.rank ?? ""}</td></tr>`).join("");
    return `<div class="card"><h2>${esc(a.name)}${closeCall ? `<span class="flag">Close call at the 7th spot (${c7} picks tie)</span>` : ""}</h2>${rows.length ? `<table><tr><th class="num">#</th><th>Nominee</th><th class="num">Winner picks</th><th>Picked by</th><th class="num">Backup</th><th>Backup by</th><th class="num">Suggested rank</th></tr>${body}</table>` : `<div class="small">No picks yet.</div>`}</div>`;
  }).join("");
  const multiRows = Object.values(multi).filter(m => m.aw.length > 1);
  $("admin").innerHTML = `<h1>Review tracker</h1><p class="lead">Live view for the organizer. Reviewers never see this page. Refreshes every minute; last ${esc(fmtClock(st.now))} ET.</p>
   <div class="card"><h2>Reviewers<span class="sp"></span><span class="small" style="text-transform:none;letter-spacing:0">${subN} of ${st.reviewers.length} submitted</span><button class="abtn" id="aRef">Refresh</button></h2>
   <table><tr><th>Reviewer</th><th>Status</th><th class="num">Awards done</th><th class="num">Winners</th><th class="num">Backups</th><th>Last active</th><th>Submitted</th></tr>${trk}</table></div>
   <div class="card"><h2>Results<span class="sp"></span><label class="chk"><input type="checkbox" id="aAll"${ALL ? " checked" : ""}> Include reviewers who have not submitted</label>
    <button class="abtn${rs.released ? "" : " pri"}" id="aRel">${rs.released ? "Hide results from reviewers" : "Share results with reviewers"}</button></h2>
    <div class="small">Counting ${ALL ? "everyone's current picks" : `${rs.submitted.length} submitted reviewer${rs.submitted.length === 1 ? "" : "s"}`}. Blue line = 7th place. Gold edge = a tie at the 7th spot. ${rs.released ? "Reviewers can see counts (not names)." : "Only you can see this."}</div></div>
   ${rs.dq?.length ? `<div class="card"><h2>Disqualified by direct leadership</h2><table><tr><th>Nominee</th><th>By</th><th>Reason</th><th>Note</th><th>When</th></tr>${rs.dq.map(d => `<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.reviewer)}</td><td>${esc(d.reason)}</td><td class="small">${esc(d.note || "")}</td><td class="small">${esc(fmtTime(d.at))}</td></tr>`).join("")}</table></div>` : ""}
   ${multiRows.length ? `<div class="card"><h2>In the top 7 of more than one award</h2><table>${multiRows.map(m => `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.aw.join(", "))}</td></tr>`).join("")}</table></div>` : ""}
   ${sections}`;
  $("aRef").onclick = loadAdmin;
  $("aAll").onchange = e => { ALL = e.target.checked; loadAdmin(); };
  $("aRel").onclick = async () => {
    const want = !rs.released;
    if (want && !confirm("Share the pick counts with all reviewers? They will see counts per nominee, not who picked whom.")) return;
    await api("/api/admin/release", {method:"POST", admin: ADMIN, body:{released: want}}); loadAdmin();
  };
  clearTimeout(loadAdmin.t); loadAdmin.t = setTimeout(() => { if (!$("admin").hidden && ADMIN) loadAdmin(); }, 60000);
}

// ---------- start ----------
async function start() {
  if (location.hash === "#admin") { ADMIN ? loadAdmin() : adminGate(); return; }
  if (TOKEN) {
    let last = null; try { last = localStorage.getItem("nr_last"); } catch {}
    const r = await api("/api/me", {method:"POST", body:{}}).catch(() => ({}));
    if (r.ok) { await enter(r.reviewer); return; }
    if (r.error === "reviewer") {
      const l = await fetchReviewers(); if (l) { showWho(l); if (last) $("whoSel").value = last; return; }
    }
    signOut();
  } else show("gate");
}
async function fetchReviewers() { return null; }
window.addEventListener("hashchange", () => location.reload());
start();
</script>
</body></html>
